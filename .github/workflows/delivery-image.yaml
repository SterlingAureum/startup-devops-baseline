name: delivery image

on:
  workflow_run:
    workflows: [delivery checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: delivery-image-main
  cancel-in-progress: false

jobs:
  route:
    if: >-
      vars.DELIVERY_PUBLISH_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.route.outputs.application }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - id: route
        env:
          PARENT_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          python3 scripts/delivery/flow.py classify --base "$(git rev-parse HEAD^)" --head "$(git rev-parse HEAD)"
          if [[ "${PARENT_EVENT}" == workflow_dispatch ]]; then
            echo 'application=true' >> "${GITHUB_OUTPUT}"
          fi

  publish:
    needs: route
    if: needs.route.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Require PR automation credentials before building
        env:
          DELIVERY_PR_TOKEN: ${{ secrets.DELIVERY_PR_TOKEN }}
        run: test -n "${DELIVERY_PR_TOKEN}" || { echo 'Configure DELIVERY_PR_TOKEN first'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - id: image
        env:
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}/demo-api" >> "${GITHUB_OUTPUT}"
          echo "reference=ghcr.io/${GITHUB_REPOSITORY,,}/demo-api:sha-${SOURCE_REVISION}" >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/demo-api
          target: runtime
          load: true
          push: false
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
      - name: Scan the exact image to publish
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.reference }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          version: v0.74.0
      - name: Generate SBOM for the scanned image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.reference }}
          format: spdx-json
          output: ${{ runner.temp }}/delivery-image.spdx.json
          scanners: vuln
          skip-setup-trivy: true
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: publish
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          docker push "${IMAGE}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${IMAGE%:*}@${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-image-sbom-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/delivery-image.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest image provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Attest image SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: ${{ runner.temp }}/delivery-image.spdx.json
          push-to-registry: true

  propose-dev:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.DELIVERY_PR_TOKEN }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.6
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Create dev release PR without merging
        env:
          DELIVERY_PR_TOKEN: ${{ secrets.DELIVERY_PR_TOKEN }}
          GH_TOKEN: ${{ secrets.DELIVERY_PR_TOKEN }}
          IMAGE: ${{ needs.publish.outputs.image }}
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/delivery/flow.py pr --target aws-dev --image "${IMAGE}" --commit "${SOURCE_REVISION}"
