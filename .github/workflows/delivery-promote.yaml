name: delivery promote selected release

on:
  workflow_dispatch:
    inputs:
      source_stage:
        description: Reverify the current source release, then propose the next environment
        required: true
        type: choice
        default: dev
        options: [dev, test]

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && vars.DELIVERY_RUNTIME_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.route.outputs.source }}
      target: ${{ steps.route.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - id: route
        env:
          SOURCE_STAGE: ${{ inputs.source_stage }}
          DELIVERY_PROD_ENABLED: ${{ vars.DELIVERY_PROD_ENABLED }}
          DELIVERY_PR_TOKEN: ${{ secrets.DELIVERY_PR_TOKEN }}
        run: |
          test -n "${DELIVERY_PR_TOKEN}"
          python3 scripts/delivery/flow.py promotion-route --source-stage "${SOURCE_STAGE}"

  verify-source:
    needs: preflight
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/delivery-verify.yaml
    with:
      environment: ${{ needs.preflight.outputs.source }}
      stage: ${{ inputs.source_stage }}
      revision: ${{ github.sha }}

  propose:
    needs: [preflight, verify-source]
    runs-on: ubuntu-latest
    concurrency:
      group: delivery-proposal-${{ needs.preflight.outputs.target }}
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.DELIVERY_PR_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.verify-source.outputs.report_name || 'missing-source-report' }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/delivery-candidate
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.6
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Propose the next environment with the verified digest
        env:
          TARGET: ${{ needs.preflight.outputs.target }}
          DELIVERY_PROD_ENABLED: ${{ vars.DELIVERY_PROD_ENABLED }}
          DELIVERY_PR_TOKEN: ${{ secrets.DELIVERY_PR_TOKEN }}
          GH_TOKEN: ${{ secrets.DELIVERY_PR_TOKEN }}
          REPORT_READ_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/delivery/flow.py pr --target "${TARGET}" --candidate "${RUNNER_TEMP}/delivery-candidate/verified.json"
