name: delivery runtime

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to reverify on current main
        required: true
        type: string
        default: aws-dev
      create_test_pr:
        description: Propose test after successful dev verification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  route:
    if: github.ref == 'refs/heads/main' && vars.DELIVERY_RUNTIME_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.route.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - id: route
        env:
          BEFORE: ${{ github.event.before }}
          TARGET: ${{ inputs.environment }}
          DELIVERY_PROD_ENABLED: ${{ vars.DELIVERY_PROD_ENABLED }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            python3 scripts/delivery/flow.py runtime-route --environment "${TARGET}"
          else
            if [[ -z "${BEFORE}" || "${BEFORE}" =~ ^0+$ ]]; then BEFORE="$(git hash-object -w -t tree /dev/null)"; fi
            python3 scripts/delivery/flow.py runtime-route --base "${BEFORE}" --head "$(git rev-parse HEAD)"
          fi

  verify:
    name: verify-${{ matrix.stage }}
    needs: route
    if: needs.route.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.route.outputs.matrix) }}
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/delivery-verify.yaml
    with:
      environment: ${{ matrix.environment }}
      stage: ${{ matrix.stage }}
      revision: ${{ github.sha }}
      propose_test: ${{ matrix.environment == 'aws-dev' && (github.event_name == 'push' || inputs.create_test_pr) }}
    secrets:
      DELIVERY_PR_TOKEN: ${{ matrix.environment == 'aws-dev' && (github.event_name == 'push' || inputs.create_test_pr) && secrets.DELIVERY_PR_TOKEN || '' }}
