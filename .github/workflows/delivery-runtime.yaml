name: delivery runtime

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to reverify on current main
        required: true
        type: choice
        default: aws-dev
        options: [aws-dev, aws-test, aws-prod]
      create_test_pr:
        description: Propose test after successful dev verification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  route:
    if: github.ref == 'refs/heads/main' && vars.DELIVERY_RUNTIME_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      dev_release_changed: ${{ steps.route.outputs.dev_release_changed }}
      runtime_dev: ${{ steps.route.outputs.runtime_dev }}
      runtime_test: ${{ steps.route.outputs.runtime_test }}
      runtime_prod: ${{ steps.route.outputs.runtime_prod }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - id: route
        env:
          BEFORE: ${{ github.event.before }}
          TARGET: ${{ inputs.environment }}
          DELIVERY_PROD_ENABLED: ${{ vars.DELIVERY_PROD_ENABLED }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            if [[ "${TARGET}" == aws-prod && "${DELIVERY_PROD_ENABLED}" != true ]]; then
              echo 'Production runtime acceptance is disabled'
              exit 1
            fi
            for environment in aws-dev aws-test aws-prod; do
              KEY="runtime_${environment#aws-}"
              if [[ "${TARGET}" == "${environment}" ]]; then
                echo "${KEY}=true" >> "${GITHUB_OUTPUT}"
              else
                echo "${KEY}=false" >> "${GITHUB_OUTPUT}"
              fi
            done
          else
            if [[ -z "${BEFORE}" || "${BEFORE}" =~ ^0+$ ]]; then BEFORE="$(git hash-object -w -t tree /dev/null)"; fi
            python3 scripts/delivery/flow.py classify --base "${BEFORE}" --head "$(git rev-parse HEAD)"
          fi

  verify-dev:
    needs: route
    if: needs.route.outputs.runtime_dev == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/delivery-verify.yaml
    with:
      environment: aws-dev
      revision: ${{ github.sha }}

  verify-test:
    needs: route
    if: needs.route.outputs.runtime_test == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/delivery-verify.yaml
    with:
      environment: aws-test
      revision: ${{ github.sha }}

  verify-prod:
    needs: route
    if: needs.route.outputs.runtime_prod == 'true' && vars.DELIVERY_PROD_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/delivery-verify.yaml
    with:
      environment: aws-prod
      revision: ${{ github.sha }}

  propose-test:
    needs: [route, verify-dev]
    if: >-
      needs.verify-dev.result == 'success' &&
      ((github.event_name == 'push' && needs.route.outputs.dev_release_changed == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.create_test_pr))
    runs-on: ubuntu-latest
    concurrency:
      group: delivery-proposal-aws-test
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.DELIVERY_PR_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.verify-dev.outputs.report_name || 'missing-source-report' }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/delivery-candidate
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.6
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Create test PR; never merge or replace an existing PR
        env:
          DELIVERY_PR_TOKEN: ${{ secrets.DELIVERY_PR_TOKEN }}
          GH_TOKEN: ${{ secrets.DELIVERY_PR_TOKEN }}
          REPORT_READ_TOKEN: ${{ github.token }}
        run: python3 scripts/delivery/flow.py pr --target aws-test --candidate "${RUNNER_TEMP}/delivery-candidate/verified.json"
