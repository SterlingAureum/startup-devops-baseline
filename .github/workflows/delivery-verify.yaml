name: delivery verify environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      revision:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.DELIVERY_FLOW_ENABLED == 'true' && vars.DELIVERY_RUNTIME_ENABLED == 'true' &&
      (inputs.environment == 'aws-dev' || inputs.environment == 'aws-test' ||
       (inputs.environment == 'aws-prod' && vars.DELIVERY_PROD_ENABLED == 'true'))
    runs-on: [self-hosted, linux, x64, trusted-runtime, '${{ inputs.environment }}']
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}-runtime
      deployment: false
    concurrency:
      group: delivery-runtime-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check runtime tools and environment variables
        env:
          CLUSTER_NAME: ${{ vars.DELIVERY_CLUSTER_NAME }}
          ROLE_ARN: ${{ vars.AWS_RUNTIME_ROLE_ARN }}
        run: |
          for command in aws kubectl python3; do command -v "${command}"; done
          python3 -c 'import yaml'
          test -n "${CLUSTER_NAME}" && test -n "${ROLE_ARN}"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_RUNTIME_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: delivery-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
          unset-current-credentials: true
      - name: Use an isolated kubeconfig
        env:
          CLUSTER_NAME: ${{ vars.DELIVERY_CLUSTER_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          echo "KUBECONFIG=${RUNNER_TEMP}/delivery-kubeconfig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"
          aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${AWS_REGION}" \
            --kubeconfig "${RUNNER_TEMP}/delivery-kubeconfig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Wait for exact version and verify runtime metrics
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          CONFIG_REVISION: ${{ inputs.revision }}
          DELIVERY_APP_URL: ${{ vars.DELIVERY_APP_URL }}
          DELIVERY_PROD_ENABLED: ${{ vars.DELIVERY_PROD_ENABLED }}
        run: |
          python3 scripts/delivery/runtime.py --environment "${TARGET_ENVIRONMENT}" \
            --revision "${CONFIG_REVISION}" --output "${RUNNER_TEMP}/delivery-verified/verified.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: delivery-verified-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delivery-verified/verified.json
          if-no-files-found: error
          retention-days: 30
      - name: Clean isolated runtime files
        if: always()
        run: |
          rm -f -- "${RUNNER_TEMP}/delivery-kubeconfig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -f -- "${RUNNER_TEMP}/delivery-verified/verified.json"
