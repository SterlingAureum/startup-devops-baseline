name: delivery verify environment

on:
  workflow_call:
    secrets:
      DELIVERY_PR_TOKEN:
        required: false
    outputs:
      report_name:
        description: Artifact emitted by the successful source job and its original attempt
        value: ${{ jobs.verify.outputs.report_name }}
    inputs:
      environment:
        required: true
        type: string
      stage:
        required: true
        type: string
      propose_test:
        type: boolean
        default: false
      revision:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: verify (${{ inputs.environment }})
    outputs:
      report_name: ${{ steps.acceptance.outputs.report_name }}
    if: >-
      github.ref == 'refs/heads/main' && inputs.revision == github.sha &&
      vars.DELIVERY_RUNTIME_ENABLED == 'true' &&
      (inputs.stage == 'dev' || inputs.stage == 'test' ||
       (inputs.stage == 'prod' && vars.DELIVERY_PROD_ENABLED == 'true'))
    runs-on: [self-hosted, linux, x64, trusted-runtime, '${{ inputs.environment }}']
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}-runtime
      deployment: false
    concurrency:
      group: delivery-runtime-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check runtime tools and environment variables
        env:
          CLUSTER_NAME: ${{ vars.DELIVERY_CLUSTER_NAME }}
          ROLE_ARN: ${{ vars.AWS_RUNTIME_ROLE_ARN }}
        run: |
          for command in aws kubectl python3; do command -v "${command}"; done
          python3 -c 'import yaml'
          test -n "${CLUSTER_NAME}" && test -n "${ROLE_ARN}"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_RUNTIME_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: delivery-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
          unset-current-credentials: true
      - name: Use an isolated kubeconfig
        env:
          CLUSTER_NAME: ${{ vars.DELIVERY_CLUSTER_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          echo "REPORT_DIR=${RUNNER_TEMP}/delivery-verified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ inputs.environment }}" >> "${GITHUB_ENV}"
          echo "KUBECONFIG=${RUNNER_TEMP}/delivery-kubeconfig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ inputs.environment }}" >> "${GITHUB_ENV}"
          aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${AWS_REGION}" \
            --kubeconfig "${RUNNER_TEMP}/delivery-kubeconfig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ inputs.environment }}"
      - id: acceptance
        name: Wait for exact version and verify runtime metrics
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          CONFIG_REVISION: ${{ inputs.revision }}
          DELIVERY_APP_URL: ${{ vars.DELIVERY_APP_URL }}
          DELIVERY_PROD_ENABLED: ${{ vars.DELIVERY_PROD_ENABLED }}
        run: |
          python3 scripts/delivery/runtime.py --environment "${TARGET_ENVIRONMENT}" \
            --revision "${CONFIG_REVISION}" --output "${REPORT_DIR}/verified.json"
          echo "report_name=delivery-verified-${TARGET_ENVIRONMENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
      - name: Upload runtime outcome
        if: ${{ !cancelled() && (steps.acceptance.outcome == 'success' || steps.acceptance.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.acceptance.outcome == 'success' && 'delivery-verified' || 'delivery-diagnostic' }}-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}/verified.json
          if-no-files-found: error
          retention-days: 30
      - name: Clean isolated runtime files
        if: always()
        run: |
          rm -f -- "${RUNNER_TEMP}/delivery-kubeconfig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ inputs.environment }}"
          if [[ -n "${REPORT_DIR:-}" ]]; then rm -f -- "${REPORT_DIR}/verified.json"; fi
          echo "Runtime acceptance for ${{ inputs.environment }}: ${{ steps.acceptance.outcome }} (attempt ${GITHUB_RUN_ATTEMPT})." >> "${GITHUB_STEP_SUMMARY}"

  propose-test:
    needs: verify
    if: needs.verify.result == 'success' && inputs.propose_test && inputs.environment == 'aws-dev'
    runs-on: ubuntu-latest
    concurrency:
      group: delivery-proposal-aws-test
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.DELIVERY_PR_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.verify.outputs.report_name || 'missing-source-report' }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/delivery-candidate
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.6
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Create test PR; never merge or replace an existing PR
        env:
          DELIVERY_PR_TOKEN: ${{ secrets.DELIVERY_PR_TOKEN }}
          GH_TOKEN: ${{ secrets.DELIVERY_PR_TOKEN }}
          REPORT_READ_TOKEN: ${{ github.token }}
        run: python3 scripts/delivery/flow.py pr --target aws-test --candidate "${RUNNER_TEMP}/delivery-candidate/verified.json"
