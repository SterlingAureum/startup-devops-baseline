name: demo-api image publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/demo-api/src/**'
      - 'apps/demo-api/tests/**'
      - 'apps/demo-api/Dockerfile'
      - 'apps/demo-api/requirements.txt'
      - '.github/workflows/demo-api-image-publish.yaml'
      - 'scripts/write-demo-api-image-metadata.sh'
      - 'scripts/promote-demo-api-image.sh'
  workflow_dispatch:
    inputs:
      create_promotion_pr:
        description: Create a promotion PR after publishing the image
        required: false
        default: false
        type: boolean
      promotion_base_branch:
        description: Base branch for a manually requested promotion PR
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: demo-api-image-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/demo-api

jobs:
  quality-gates:
    uses: ./.github/workflows/reusable-quality-gates.yaml

  build-and-push:
    needs:
      - quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image-repository: ${{ steps.identity.outputs.image-repository }}
      image-tag: ${{ steps.identity.outputs.image-tag }}
      image-digest: ${{ steps.identity.outputs.image-digest }}
      metadata-artifact-name: ${{ steps.identity.outputs.artifact-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize image repository
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=demo-api
            org.opencontainers.image.description=Demo API for startup-devops-baseline
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: apps/demo-api
          file: apps/demo-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write image identity metadata
        id: identity
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: demo-api-image-metadata-${{ github.sha }}
          OUTPUT_FILE: ${{ runner.temp }}/demo-api-image-metadata.json
        run: |
          IMAGE_TAG="sha-${SOURCE_COMMIT:0:7}" \
            ./scripts/write-demo-api-image-metadata.sh

      - name: Upload image identity metadata
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: ${{ runner.temp }}/demo-api-image-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest image build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish image identity summary
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### demo-api image identity"
            echo
            echo "- Tag: \`sha-${GITHUB_SHA:0:7}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  promote-aws-dev:
    name: Create aws-dev promotion PR
    needs:
      - build-and-push
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_promotion_pr)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      PROMOTION_BASE_BRANCH: >-
        ${{ github.event_name == 'workflow_dispatch' &&
            inputs.promotion_base_branch ||
            github.event.repository.default_branch }}
      METADATA_ARTIFACT_NAME: ${{ needs.build-and-push.outputs.metadata-artifact-name }}
      METADATA_DIRECTORY: .promotion/demo-api-image
      METADATA_FILE: .promotion/demo-api-image/demo-api-image-metadata.json
      VALUES_FILE: apps/demo-api/helm/values-aws-dev.yaml
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download image identity metadata
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.METADATA_ARTIFACT_NAME }}
          path: ${{ env.METADATA_DIRECTORY }}

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Prepare promotion branch
        id: promotion
        env:
          EXPECTED_IMAGE_REPOSITORY: ${{ needs.build-and-push.outputs.image-repository }}
          EXPECTED_SOURCE_REPOSITORY: ${{ github.repository }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          base_branch="${PROMOTION_BASE_BRANCH}"

          if ! git check-ref-format "refs/heads/${base_branch}" >/dev/null 2>&1; then
            echo "::error::Invalid promotion base branch: ${base_branch}"
            exit 1
          fi

          if ! git ls-remote --exit-code --heads origin \
            "refs/heads/${base_branch}" >/dev/null; then
            echo "::error::Promotion base branch does not exist: ${base_branch}"
            exit 1
          fi

          image_tag="$(jq --raw-output '.image.tag' "${METADATA_FILE}")"
          if [[ ! "${image_tag}" =~ ^sha-[0-9a-f]{7}$ ]]; then
            echo "::error::Invalid promotion image tag: ${image_tag}"
            exit 1
          fi

          promotion_branch="release/demo-api-${image_tag}"
          git fetch --no-tags origin \
            "+refs/heads/${base_branch}:refs/remotes/origin/${base_branch}"

          if ! git merge-base --is-ancestor \
            "${GITHUB_SHA}" "origin/${base_branch}"; then
            echo "::error::The published source revision is not contained in ${base_branch}. For feature-branch validation, select the same feature branch as the promotion base."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin \
            "refs/heads/${promotion_branch}" >/dev/null 2>&1; then
            git fetch --no-tags origin \
              "+refs/heads/${promotion_branch}:refs/remotes/origin/${promotion_branch}"
            git switch --create "${promotion_branch}" \
              --track "origin/${promotion_branch}"
          else
            git switch --create "${promotion_branch}" "origin/${base_branch}"
          fi

          EXPECTED_IMAGE_REPOSITORY="${EXPECTED_IMAGE_REPOSITORY}" \
          EXPECTED_SOURCE_REPOSITORY="${EXPECTED_SOURCE_REPOSITORY}" \
          EXPECTED_SOURCE_COMMIT="${EXPECTED_SOURCE_COMMIT}" \
          METADATA_FILE="${METADATA_FILE}" \
          VALUES_FILE="${VALUES_FILE}" \
            ./scripts/promote-demo-api-image.sh

          helm lint apps/demo-api/helm --values "${VALUES_FILE}"
          helm template demo-api apps/demo-api/helm \
            --values "${VALUES_FILE}" >/dev/null
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          changed=false
          if ! git diff --quiet -- "${VALUES_FILE}"; then
            git add "${VALUES_FILE}"
            git commit -m "release: promote aws-dev demo-api ${image_tag}"
            git push origin "HEAD:refs/heads/${promotion_branch}"
            changed=true
          fi

          echo "base-branch=${base_branch}" >> "${GITHUB_OUTPUT}"
          echo "promotion-branch=${promotion_branch}" >> "${GITHUB_OUTPUT}"
          echo "image-tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      - name: Create or reuse promotion pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ steps.promotion.outputs.base-branch }}
          PROMOTION_BRANCH: ${{ steps.promotion.outputs.promotion-branch }}
          IMAGE_TAG: ${{ steps.promotion.outputs.image-tag }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image-digest }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

          if git diff --quiet "origin/${BASE_BRANCH}" HEAD; then
            echo "status=already-promoted" >> "${GITHUB_OUTPUT}"
            echo "url=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mapfile -t changed_files < <(
            git diff --name-only "origin/${BASE_BRANCH}" HEAD
          )
          if [[ "${#changed_files[@]}" != "1" || \
                "${changed_files[0]}" != "${VALUES_FILE}" ]]; then
            echo "::error::Promotion branch must differ from the base only in ${VALUES_FILE}."
            printf 'Unexpected promotion diff: %s\n' "${changed_files[@]}"
            exit 1
          fi

          pr_url="$(
            gh pr list \
              --state open \
              --base "${BASE_BRANCH}" \
              --head "${PROMOTION_BRANCH}" \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [[ -z "${pr_url}" ]]; then
            body_file="$(mktemp)"
            {
              echo "## aws-dev demo-api promotion"
              echo
              echo "- Image tag: \`${IMAGE_TAG}\`"
              echo "- Image digest: \`${IMAGE_DIGEST}\`"
              echo "- Source commit: \`${GITHUB_SHA}\`"
              echo "- Build workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo "This PR updates Git desired state only. Merge remains a human decision; Argo CD performs reconciliation after approval."
            } > "${body_file}"

            if ! pr_url="$(
              gh pr create \
                --base "${BASE_BRANCH}" \
                --head "${PROMOTION_BRANCH}" \
                --title "release: promote aws-dev demo-api ${IMAGE_TAG}" \
                --body-file "${body_file}"
            )"; then
              echo "::error::Could not create the promotion PR. Enable repository Actions permission to create pull requests, then rerun this job."
              exit 1
            fi
            status=created
          else
            status=reused
          fi

          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "url=${pr_url}" >> "${GITHUB_OUTPUT}"

      - name: Publish promotion summary
        env:
          PR_STATUS: ${{ steps.pull-request.outputs.status }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
          IMAGE_TAG: ${{ steps.promotion.outputs.image-tag }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image-digest }}
          BASE_BRANCH: ${{ steps.promotion.outputs.base-branch }}
          PROMOTION_BRANCH: ${{ steps.promotion.outputs.promotion-branch }}
        run: |
          {
            echo "### aws-dev promotion"
            echo
            echo "- Status: \`${PR_STATUS}\`"
            echo "- Image: \`${IMAGE_TAG}@${IMAGE_DIGEST}\`"
            echo "- Base branch: \`${BASE_BRANCH}\`"
            echo "- Promotion branch: \`${PROMOTION_BRANCH}\`"
            if [[ -n "${PR_URL}" ]]; then
              echo "- Pull request: ${PR_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
