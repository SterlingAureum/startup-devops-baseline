name: demo-api image publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/demo-api/**'
      - '.github/workflows/demo-api-image-publish.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: demo-api-image-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/demo-api

jobs:
  quality-gates:
    uses: ./.github/workflows/reusable-quality-gates.yaml

  build-and-push:
    needs:
      - quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image repository
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=demo-api
            org.opencontainers.image.description=Demo API for startup-devops-baseline
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/demo-api
          file: apps/demo-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write image identity metadata
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          OUTPUT_FILE: ${{ runner.temp }}/demo-api-image-metadata.json
        run: |
          IMAGE_TAG="sha-${SOURCE_COMMIT:0:7}" \
            ./scripts/write-demo-api-image-metadata.sh

      - name: Upload image identity metadata
        uses: actions/upload-artifact@v4
        with:
          name: demo-api-image-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/demo-api-image-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest image build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish image identity summary
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### demo-api image identity"
            echo
            echo "- Tag: \`sha-${GITHUB_SHA:0:7}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
