name: demo-api image publish

on:
  workflow_call:
    inputs:
      caller_ref:
        description: Calling workflow ref; reusable orchestration requires protected main
        required: true
        type: string
      create_promotion_pr:
        description: Create or reuse the aws-dev release PR after publishing
        required: false
        default: false
        type: boolean
      promotion_base_branch:
        description: Protected base branch for the aws-dev release PR
        required: false
        default: main
        type: string
    outputs:
      image_repository:
        description: Published lowercase GHCR repository
        value: ${{ jobs.build-and-push.outputs.image-repository }}
      image_tag:
        description: Immutable commit-derived image tag
        value: ${{ jobs.build-and-push.outputs.image-tag }}
      image_digest:
        description: Published immutable image digest
        value: ${{ jobs.build-and-push.outputs.image-digest }}
      metadata_artifact_name:
        description: Image identity metadata artifact
        value: ${{ jobs.build-and-push.outputs.metadata-artifact-name }}
      promotion_status:
        description: aws-dev release PR stage status when requested
        value: ${{ jobs.promote-aws-dev.outputs.status }}
      promotion_pr_url:
        description: Created or reused aws-dev release PR URL
        value: ${{ jobs.promote-aws-dev.outputs.pr-url }}
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/demo-api/src/**'
      - 'apps/demo-api/tests/**'
      - 'apps/demo-api/Dockerfile'
      - 'apps/demo-api/requirements.txt'
      - '.github/workflows/demo-api-image-publish.yaml'
      - 'scripts/write-demo-api-image-metadata.sh'
      - 'scripts/promote-demo-api-image.sh'
      - 'scripts/set-demo-api-delivery-metadata.sh'
  workflow_dispatch:
    inputs:
      create_promotion_pr:
        description: Create a promotion PR after publishing the image
        required: false
        default: false
        type: boolean
      promotion_base_branch:
        description: Base branch for a manually requested promotion PR
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: demo-api-image-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/demo-api

jobs:
  quality-gates:
    uses: ./.github/workflows/reusable-quality-gates.yaml

  build-and-push:
    needs:
      - quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image-repository: ${{ steps.identity.outputs.image-repository }}
      image-tag: ${{ steps.identity.outputs.image-tag }}
      image-digest: ${{ steps.identity.outputs.image-digest }}
      metadata-artifact-name: ${{ steps.identity.outputs.artifact-name }}
    steps:
      - name: Enforce protected main for reusable invocation
        if: inputs.caller_ref != ''
        env:
          CALLER_REF: ${{ inputs.caller_ref }}
        run: |
          if [[ "${CALLER_REF}" != "refs/heads/main" || \
                "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::The reusable image stage may be called only from protected main."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set image identity
        id: image
        run: |
          image_repository="${IMAGE_NAME,,}"
          image_tag="sha-${GITHUB_SHA:0:7}"
          {
            echo "name=${image_repository}"
            echo "tag=${image_tag}"
            echo "reference=${image_repository}:${image_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=demo-api
            org.opencontainers.image.description=Demo API for startup-devops-baseline
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build security candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/demo-api
          file: apps/demo-api/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.reference }}
          format: table
          hide-progress: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Generate SPDX JSON SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.reference }}
          format: spdx-json
          output: ${{ runner.temp }}/demo-api.spdx.json
          hide-progress: true
          scanners: vuln
          skip-setup-trivy: true

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image
        id: publish
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          PRIMARY_IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          while IFS= read -r image_reference; do
            [[ -n "${image_reference}" ]] || continue
            docker push "${image_reference}"
          done <<< "${IMAGE_TAGS}"

          image_digest="$(
            docker buildx imagetools inspect \
              "${PRIMARY_IMAGE_REFERENCE}" \
              --format '{{json .Manifest.Digest}}' |
              tr -d '"'
          )"
          if [[ ! "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve the published image digest."
            exit 1
          fi
          echo "digest=${image_digest}" >> "${GITHUB_OUTPUT}"

      - name: Write image identity metadata
        id: identity
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: demo-api-image-metadata-${{ github.sha }}
          OUTPUT_FILE: ${{ runner.temp }}/demo-api-image-metadata.json
        run: |
          IMAGE_TAG="sha-${SOURCE_COMMIT:0:7}" \
            ./scripts/write-demo-api-image-metadata.sh

      - name: Upload image identity metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: ${{ runner.temp }}/demo-api-image-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload SPDX JSON SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-api-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/demo-api.spdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest image build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: ${{ runner.temp }}/demo-api.spdx.json
          push-to-registry: true

      - name: Publish image identity summary
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "### demo-api image identity"
            echo
            echo "- Tag: \`sha-${GITHUB_SHA:0:7}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  promote-aws-dev:
    name: Create aws-dev promotion PR
    needs:
      - build-and-push
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      inputs.create_promotion_pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      status: ${{ steps.pull-request.outputs.status }}
      pr-url: ${{ steps.pull-request.outputs.url }}
      promotion-branch: ${{ steps.promotion.outputs.promotion-branch }}
      changed: ${{ steps.promotion.outputs.changed }}
    env:
      PROMOTION_BASE_BRANCH: >-
        ${{ inputs.promotion_base_branch ||
            github.event.repository.default_branch }}
      METADATA_ARTIFACT_NAME: ${{ needs.build-and-push.outputs.metadata-artifact-name }}
      METADATA_DIRECTORY: .promotion/demo-api-image
      METADATA_FILE: .promotion/demo-api-image/demo-api-image-metadata.json
      ENVIRONMENT_VALUES_FILE: apps/demo-api/helm/values/environments/aws-dev.yaml
      VALUES_FILE: apps/demo-api/helm/values/releases/aws-dev.yaml
    steps:
      - name: Checkout source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download image identity metadata
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ env.METADATA_ARTIFACT_NAME }}
          path: ${{ env.METADATA_DIRECTORY }}

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Prepare promotion branch
        id: promotion
        env:
          EXPECTED_IMAGE_REPOSITORY: ${{ needs.build-and-push.outputs.image-repository }}
          EXPECTED_SOURCE_REPOSITORY: ${{ github.repository }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          base_branch="${PROMOTION_BASE_BRANCH}"

          if ! git check-ref-format "refs/heads/${base_branch}" >/dev/null 2>&1; then
            echo "::error::Invalid promotion base branch: ${base_branch}"
            exit 1
          fi

          if ! git ls-remote --exit-code --heads origin \
            "refs/heads/${base_branch}" >/dev/null; then
            echo "::error::Promotion base branch does not exist: ${base_branch}"
            exit 1
          fi

          image_tag="$(jq --raw-output '.image.tag' "${METADATA_FILE}")"
          if [[ ! "${image_tag}" =~ ^sha-[0-9a-f]{7}$ ]]; then
            echo "::error::Invalid promotion image tag: ${image_tag}"
            exit 1
          fi

          promotion_branch="release/demo-api-${image_tag}"
          git fetch --no-tags origin \
            "+refs/heads/${base_branch}:refs/remotes/origin/${base_branch}"

          if ! git merge-base --is-ancestor \
            "${GITHUB_SHA}" "origin/${base_branch}"; then
            echo "::error::The published source revision is not contained in ${base_branch}. For feature-branch validation, select the same feature branch as the promotion base."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin \
            "refs/heads/${promotion_branch}" >/dev/null 2>&1; then
            git fetch --no-tags origin \
              "+refs/heads/${promotion_branch}:refs/remotes/origin/${promotion_branch}"
            git switch --create "${promotion_branch}" \
              --track "origin/${promotion_branch}"
          else
            git switch --create "${promotion_branch}" "origin/${base_branch}"
          fi

          EXPECTED_IMAGE_REPOSITORY="${EXPECTED_IMAGE_REPOSITORY}" \
          EXPECTED_SOURCE_REPOSITORY="${EXPECTED_SOURCE_REPOSITORY}" \
          EXPECTED_SOURCE_COMMIT="${EXPECTED_SOURCE_COMMIT}" \
          METADATA_FILE="${METADATA_FILE}" \
          VALUES_FILE="${VALUES_FILE}" \
            ./scripts/promote-demo-api-image.sh

          helm lint apps/demo-api/helm \
            --values "${ENVIRONMENT_VALUES_FILE}" \
            --values "${VALUES_FILE}"
          helm template demo-api apps/demo-api/helm \
            --values "${ENVIRONMENT_VALUES_FILE}" \
            --values "${VALUES_FILE}" >/dev/null
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          changed=false
          if ! git diff --quiet -- "${VALUES_FILE}"; then
            git add "${VALUES_FILE}"
            git commit -m "release: promote aws-dev demo-api ${image_tag}"
            git push origin "HEAD:refs/heads/${promotion_branch}"
            changed=true
          fi

          echo "base-branch=${base_branch}" >> "${GITHUB_OUTPUT}"
          echo "promotion-branch=${promotion_branch}" >> "${GITHUB_OUTPUT}"
          echo "image-tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      - name: Create or reuse promotion pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ steps.promotion.outputs.base-branch }}
          PROMOTION_BRANCH: ${{ steps.promotion.outputs.promotion-branch }}
          IMAGE_TAG: ${{ steps.promotion.outputs.image-tag }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image-digest }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

          if git diff --quiet "origin/${BASE_BRANCH}" HEAD; then
            echo "status=already-promoted" >> "${GITHUB_OUTPUT}"
            echo "url=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mapfile -t changed_files < <(
            git diff --name-only "origin/${BASE_BRANCH}" HEAD
          )
          if [[ "${#changed_files[@]}" != "1" || \
                "${changed_files[0]}" != "${VALUES_FILE}" ]]; then
            echo "::error::Promotion branch must differ from the base only in ${VALUES_FILE}."
            printf 'Unexpected promotion diff: %s\n' "${changed_files[@]}"
            exit 1
          fi

          pr_url="$(
            gh pr list \
              --state open \
              --base "${BASE_BRANCH}" \
              --head "${PROMOTION_BRANCH}" \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [[ -z "${pr_url}" ]]; then
            body_file="$(mktemp)"
            {
              echo "## aws-dev demo-api promotion"
              echo
              echo "- Image tag: \`${IMAGE_TAG}\`"
              echo "- Image digest: \`${IMAGE_DIGEST}\`"
              echo "- Source commit: \`${GITHUB_SHA}\`"
              echo "- Build workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo "This PR updates Git desired state only. Merge remains a human decision; Argo CD performs reconciliation after approval."
            } > "${body_file}"

            if ! pr_url="$(
              gh pr create \
                --base "${BASE_BRANCH}" \
                --head "${PROMOTION_BRANCH}" \
                --title "release: promote aws-dev demo-api ${IMAGE_TAG}" \
                --body-file "${body_file}"
            )"; then
              echo "::error::Could not create the promotion PR. Enable repository Actions permission to create pull requests, then rerun this job."
              exit 1
            fi
            status=created
          else
            status=reused
          fi

          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "url=${pr_url}" >> "${GITHUB_OUTPUT}"

      - name: Publish promotion summary
        env:
          PR_STATUS: ${{ steps.pull-request.outputs.status }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
          IMAGE_TAG: ${{ steps.promotion.outputs.image-tag }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image-digest }}
          BASE_BRANCH: ${{ steps.promotion.outputs.base-branch }}
          PROMOTION_BRANCH: ${{ steps.promotion.outputs.promotion-branch }}
        run: |
          {
            echo "### aws-dev promotion"
            echo
            echo "- Status: \`${PR_STATUS}\`"
            echo "- Image: \`${IMAGE_TAG}@${IMAGE_DIGEST}\`"
            echo "- Base branch: \`${BASE_BRANCH}\`"
            echo "- Promotion branch: \`${PROMOTION_BRANCH}\`"
            if [[ -n "${PR_URL}" ]]; then
              echo "- Pull request: ${PR_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
