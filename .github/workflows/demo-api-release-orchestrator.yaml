name: demo-api release orchestrator

on:
  push:
    branches:
      - main
    paths:
      - 'apps/demo-api/src/**'
      - 'apps/demo-api/tests/**'
      - 'apps/demo-api/Dockerfile'
      - 'apps/demo-api/requirements.txt'
      - 'apps/demo-api/helm/values/releases/aws-*.yaml'
      - 'evidence/demo-api/**/*.json'
      - '.github/workflows/demo-api-release-orchestrator.yaml'
      - 'delivery/contracts/demo-api-orchestrator.json'
      - 'delivery/contracts/demo-api-qualification-scope.json'
      - 'delivery/contracts/demo-api-qualification-scope-aws-test.json'
      - 'delivery/contracts/qualification-bundle.schema.json'
      - 'delivery/contracts/orchestration-attempt.schema.json'
      - 'delivery/contracts/demo-api-failure-recovery-policy.json'
      - 'scripts/collect-demo-api-orchestration-snapshot.py'
      - 'scripts/derive-demo-api-orchestration-plan.py'
      - 'scripts/demo_api_qualification_scope.py'
      - 'scripts/demo_api_qualification_bundle.py'
      - 'scripts/calculate-demo-api-qualification-scope.py'
      - 'scripts/write-demo-api-qualification-bundle.py'
      - 'scripts/validate-demo-api-qualification-bundle.py'
      - 'scripts/demo_api_orchestration_attempt.py'
      - 'scripts/write-demo-api-orchestration-attempt.py'
      - 'scripts/resolve-demo-api-rollback-candidate.py'
  workflow_dispatch:
    inputs:
      operation:
        description: Start, inspect, resume changed facts, or retry one safe failed Attempt
        required: true
        default: status
        type: choice
        options:
          - start
          - status
          - resume
          - retry
      release_id:
        description: Optional deterministic release ID to inspect or resume
        required: false
        type: string
      retry_run_id:
        description: Prior orchestrator run ID; required only for retry
        required: false
        type: string
      retry_run_attempt:
        description: Prior orchestrator run attempt; required only for retry
        required: false
        type: string
      test_rollout_gate:
        description: Explicit human confirmation after the guarded aws-test Canary helper completed
        required: true
        default: not-reviewed
        type: choice
        options:
          - not-reviewed
          - reviewed-and-completed
      policy:
        description: Delivery policy; production remains reviewed in every mode
        required: true
        default: reviewed
        type: choice
        options:
          - reviewed
          - continuous-nonprod

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: demo-api-release-orchestrator-${{ inputs.release_id || github.ref }}
  cancel-in-progress: false

jobs:
  derive:
    name: Derive release state and next action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      operation: ${{ steps.context.outputs.operation }}
      release-id: ${{ steps.finalize.outputs.release-id }}
      phase: ${{ steps.finalize.outputs.phase }}
      status: ${{ steps.finalize.outputs.status }}
      reason: ${{ steps.finalize.outputs.reason }}
      recommended-action: ${{ steps.finalize.outputs.recommended-action }}
      target-environment: ${{ steps.finalize.outputs.target-environment }}
      dispatch-authorized: ${{ steps.finalize.outputs.dispatch-authorized }}
      control-plane-sha: ${{ steps.finalize.outputs.control-plane-sha }}
      source-commit: ${{ steps.finalize.outputs.source-commit }}
      image-digest: ${{ steps.finalize.outputs.image-digest }}
      release-file-sha256: ${{ steps.finalize.outputs.release-file-sha256 }}
      qualification-bundle-path: ${{ steps.finalize.outputs.qualification-bundle-path }}
      qualification-bundle-sha256: ${{ steps.finalize.outputs.qualification-bundle-sha256 }}
      started-at: ${{ steps.context.outputs.started-at }}
      retry-run-id: ${{ steps.context.outputs.retry-run-id }}
      retry-run-attempt: ${{ steps.context.outputs.retry-run-attempt }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve orchestration context
        id: context
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUESTED_POLICY: ${{ inputs.policy }}
          REQUESTED_RELEASE_ID: ${{ inputs.release_id }}
          REQUESTED_RETRY_RUN_ID: ${{ inputs.retry_run_id }}
          REQUESTED_RETRY_RUN_ATTEMPT: ${{ inputs.retry_run_attempt }}
          BEFORE_REVISION: ${{ github.event.before }}
          REQUESTED_TEST_ROLLOUT_GATE: ${{ inputs.test_rollout_gate }}
        run: |
          captured_main="$(git rev-parse HEAD)"
          operation="${REQUESTED_OPERATION:-}"
          policy="${REQUESTED_POLICY:-reviewed}"
          source_commit=""

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            operation="resume"
            before_revision="${BEFORE_REVISION}"
            if [[ ! "${before_revision}" =~ ^[0-9a-f]{40}$ ]] || \
               [[ "${before_revision}" == "0000000000000000000000000000000000000000" ]]; then
              before_revision="${captured_main}^"
            fi
            mapfile -t changed_files < <(git diff --name-only "${before_revision}" "${captured_main}")
            for path in "${changed_files[@]}"; do
              case "${path}" in
                apps/demo-api/src/*|apps/demo-api/tests/*|apps/demo-api/Dockerfile|apps/demo-api/requirements.txt)
                  operation="start"
                  source_commit="${captured_main}"
                  break
                  ;;
              esac
            done
          elif [[ "${operation}" == "start" ]]; then
            source_commit="${captured_main}"
          fi

          case "${operation}" in
            start|status|resume|retry) ;;
            *)
              echo "::error::Unsupported orchestration operation: ${operation}"
              exit 1
              ;;
          esac
          case "${policy}" in
            reviewed|continuous-nonprod) ;;
            *)
              echo "::error::Unsupported orchestration policy: ${policy}"
              exit 1
              ;;
          esac
          if [[ -n "${REQUESTED_RELEASE_ID}" && \
                ! "${REQUESTED_RELEASE_ID}" =~ ^demo-api-[0-9a-f]{12}-[0-9a-f]{12}$ ]]; then
            echo "::error::release_id does not satisfy the deterministic release identity contract."
            exit 1
          fi
          if [[ "${operation}" == "retry" ]]; then
            if [[ -z "${REQUESTED_RELEASE_ID}" || \
                  ! "${REQUESTED_RETRY_RUN_ID}" =~ ^[1-9][0-9]*$ || \
                  ! "${REQUESTED_RETRY_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::retry requires release_id, retry_run_id, and retry_run_attempt."
              exit 1
            fi
          elif [[ -n "${REQUESTED_RETRY_RUN_ID}${REQUESTED_RETRY_RUN_ATTEMPT}" ]]; then
            echo "::error::Retry lineage inputs are accepted only for operation=retry."
            exit 1
          fi

          {
            echo "operation=${operation}"
            echo "policy=${policy}"
            echo "source-commit=${source_commit}"
            echo "captured-main=${captured_main}"
            echo "requested-release-id=${REQUESTED_RELEASE_ID}"
            echo "test-rollout-gate=${REQUESTED_TEST_ROLLOUT_GATE:-not-reviewed}"
            echo "retry-run-id=${REQUESTED_RETRY_RUN_ID}"
            echo "retry-run-attempt=${REQUESTED_RETRY_RUN_ATTEMPT}"
            echo "started-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"

      - name: Download and validate the exact retry Attempt
        if: steps.context.outputs.operation == 'retry'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETRY_RUN_ID: ${{ steps.context.outputs.retry-run-id }}
          RETRY_RUN_ATTEMPT: ${{ steps.context.outputs.retry-run-attempt }}
        run: |
          run_metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETRY_RUN_ID}")"
          jq --exit-status \
            --arg repository "${GITHUB_REPOSITORY}" \
            --argjson attempt "${RETRY_RUN_ATTEMPT}" '
              .path == ".github/workflows/demo-api-release-orchestrator.yaml" and
              .head_repository.full_name == $repository and
              .run_attempt == $attempt
            ' <<< "${run_metadata}" >/dev/null || {
              echo "::error::Retry source is not the exact orchestrator run attempt in this repository."
              exit 1
            }
          artifact="demo-api-orchestration-attempt-${RETRY_RUN_ID}-${RETRY_RUN_ATTEMPT}"
          destination="${RUNNER_TEMP}/retry-attempt"
          gh run download "${RETRY_RUN_ID}" \
            --name "${artifact}" \
            --dir "${destination}"
          attempt="${destination}/result.json"
          ./scripts/validate-demo-api-orchestration-attempt.py --attempt "${attempt}"
          echo "RETRY_ATTEMPT_PATH=${attempt}" >> "${GITHUB_ENV}"

      - name: Collect read-only Git and pull-request facts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATION: ${{ steps.context.outputs.operation }}
          POLICY: ${{ steps.context.outputs.policy }}
          SOURCE_COMMIT: ${{ steps.context.outputs.source-commit }}
          CAPTURED_MAIN: ${{ steps.context.outputs.captured-main }}
          REQUESTED_RELEASE_ID: ${{ steps.context.outputs.requested-release-id }}
          TEST_ROLLOUT_GATE: ${{ steps.context.outputs.test-rollout-gate }}
          RETRY_RUN_ID: ${{ steps.context.outputs.retry-run-id }}
          RETRY_RUN_ATTEMPT: ${{ steps.context.outputs.retry-run-attempt }}
        run: |
          arguments=(
            --operation "${OPERATION}"
            --policy "${POLICY}"
            --event-name "${GITHUB_EVENT_NAME}"
            --ref "${GITHUB_REF}"
            --captured-main-revision "${CAPTURED_MAIN}"
            --observed-main-revision "${CAPTURED_MAIN}"
            --repository "${GITHUB_REPOSITORY}"
            --output "${RUNNER_TEMP}/demo-api-orchestration-snapshot.json"
            --test-rollout-gate "${TEST_ROLLOUT_GATE}"
          )
          if [[ -n "${SOURCE_COMMIT}" ]]; then
            arguments+=(--source-commit "${SOURCE_COMMIT}")
          fi
          if [[ -n "${REQUESTED_RELEASE_ID}" ]]; then
            arguments+=(--requested-release-id "${REQUESTED_RELEASE_ID}")
          fi
          if [[ "${OPERATION}" == "retry" ]]; then
            arguments+=(
              --retry-attempt-json "${RETRY_ATTEMPT_PATH}"
              --retry-run-id "${RETRY_RUN_ID}"
              --retry-run-attempt "${RETRY_RUN_ATTEMPT}"
            )
          fi
          ./scripts/collect-demo-api-orchestration-snapshot.py "${arguments[@]}"

      - name: Derive deterministic plan
        run: |
          ./scripts/derive-demo-api-orchestration-plan.py \
            --snapshot "${RUNNER_TEMP}/demo-api-orchestration-snapshot.json" \
            --output "${RUNNER_TEMP}/demo-api-orchestration-decision.json"

      - name: Recheck protected main and block a stale plan
        id: finalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          observed_main="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          planned_main="$(
            jq --raw-output '.observedMainRevision' \
              "${RUNNER_TEMP}/demo-api-orchestration-decision.json"
          )"
          if [[ "${observed_main}" != "${planned_main}" ]]; then
            python3 -c \
              'import json,sys; from pathlib import Path; p=Path(sys.argv[1]); d=json.loads(p.read_text()); d["observedMainRevision"]=sys.argv[2]; p.write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")' \
              "${RUNNER_TEMP}/demo-api-orchestration-snapshot.json" \
              "${observed_main}"
            ./scripts/derive-demo-api-orchestration-plan.py \
              --snapshot "${RUNNER_TEMP}/demo-api-orchestration-snapshot.json" \
              --output "${RUNNER_TEMP}/demo-api-orchestration-decision.json"
          fi

          for field in releaseId phase status reason recommendedAction targetEnvironment; do
            output_name="$(sed -E 's/([A-Z])/-\L\1/g' <<< "${field}")"
            value="$(jq --raw-output --arg field "${field}" '.[$field] // empty' \
              "${RUNNER_TEMP}/demo-api-orchestration-decision.json")"
            echo "${output_name}=${value}" >> "${GITHUB_OUTPUT}"
          done
          target_environment="$(jq --raw-output '.targetEnvironment // "aws-dev"' "${RUNNER_TEMP}/demo-api-orchestration-decision.json")"
          if [[ "${target_environment}" != "aws-dev" && \
                "${target_environment}" != "aws-test" && \
                "${target_environment}" != "aws-prod" ]]; then
            target_environment="aws-dev"
          fi
          bundle_environment="aws-dev"
          if [[ "$(jq --raw-output '.recommendedAction' "${RUNNER_TEMP}/demo-api-orchestration-decision.json")" == \
                "prepare-prod-promotion" ]]; then
            bundle_environment="aws-test"
          fi
          {
            echo "dispatch-authorized=$(jq --raw-output '.dispatchAuthorized' "${RUNNER_TEMP}/demo-api-orchestration-decision.json")"
            echo "control-plane-sha=$(jq --raw-output '.observedMainRevision' "${RUNNER_TEMP}/demo-api-orchestration-decision.json")"
            echo "source-commit=$(jq --raw-output '.activeRelease.sourceCommit // empty' "${RUNNER_TEMP}/demo-api-orchestration-snapshot.json")"
            echo "image-digest=$(jq --raw-output '.activeRelease.imageDigest // empty' "${RUNNER_TEMP}/demo-api-orchestration-snapshot.json")"
            echo "release-file-sha256=$(jq --raw-output --arg environment "${target_environment}" '.releases[$environment].sha256' "${RUNNER_TEMP}/demo-api-orchestration-snapshot.json")"
            echo "qualification-bundle-path=$(jq --raw-output --arg environment "${bundle_environment}" '.qualificationBundles[$environment].ref // empty' "${RUNNER_TEMP}/demo-api-orchestration-snapshot.json")"
            echo "qualification-bundle-sha256=$(jq --raw-output --arg environment "${bundle_environment}" '.qualificationBundles[$environment].sha256 // empty' "${RUNNER_TEMP}/demo-api-orchestration-snapshot.json")"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish orchestration summary
        run: |
          release_id="$(jq --raw-output '.releaseId // "not-yet-assigned"' "${RUNNER_TEMP}/demo-api-orchestration-decision.json")"
          phase="$(jq --raw-output '.phase' "${RUNNER_TEMP}/demo-api-orchestration-decision.json")"
          status="$(jq --raw-output '.status' "${RUNNER_TEMP}/demo-api-orchestration-decision.json")"
          reason="$(jq --raw-output '.reason // "none"' "${RUNNER_TEMP}/demo-api-orchestration-decision.json")"
          action="$(jq --raw-output '.recommendedAction' "${RUNNER_TEMP}/demo-api-orchestration-decision.json")"
          target="$(jq --raw-output '.targetEnvironment // "none"' "${RUNNER_TEMP}/demo-api-orchestration-decision.json")"
          dispatch="$(jq --raw-output '.dispatchAuthorized' "${RUNNER_TEMP}/demo-api-orchestration-decision.json")"
          pr_url="$(jq --raw-output '.openPullRequest.url // empty' "${RUNNER_TEMP}/demo-api-orchestration-decision.json")"
          {
            echo "### demo-api release orchestration"
            echo
            echo "- Operation: \`${{ steps.context.outputs.operation }}\`"
            echo "- Release: \`${release_id}\`"
            echo "- State: \`${phase} / ${status}\`"
            echo "- Reason: \`${reason}\`"
            echo "- Recommended action: \`${action}\`"
            echo "- Target environment: \`${target}\`"
            echo "- Dispatch authorized by plan: \`${dispatch}\`"
            echo "- aws-dev qualification enabled: \`${{ vars.DEMO_API_AWS_DEV_QUALIFICATION_ENABLED == 'true' }}\`"
            echo "- aws-test Promotion enabled: \`${{ vars.DEMO_API_AWS_TEST_PROMOTION_ENABLED == 'true' }}\`"
            echo "- aws-test qualification enabled: \`${{ vars.DEMO_API_AWS_TEST_QUALIFICATION_ENABLED == 'true' }}\`"
            echo "- aws-prod Promotion enabled: \`${{ vars.DEMO_API_AWS_PROD_PROMOTION_ENABLED == 'true' }}\`"
            if [[ -n "${pr_url}" ]]; then
              echo "- Existing pull request: ${pr_url}"
            fi
            echo
            echo "v0.10.7 makes status strictly read-only, accepts only exact safe retry lineage, and records a secret-free Attempt. It never closes or merges a PR, writes Kubernetes, creates an environment, runs production qualification, or dispatches rollback."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload derived snapshot and decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-api-orchestration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/demo-api-orchestration-snapshot.json
            ${{ runner.temp }}/demo-api-orchestration-decision.json
          if-no-files-found: error
          retention-days: 14

  prepare-test-promotion:
    name: Prepare reviewed aws-dev to aws-test Promotion
    needs: derive
    if: >-
      needs.derive.outputs.recommended-action == 'prepare-test-promotion' &&
      needs.derive.outputs.operation != 'status' &&
      needs.derive.outputs.dispatch-authorized == 'true' &&
      vars.DEMO_API_AWS_TEST_PROMOTION_ENABLED == 'true'
    permissions:
      contents: write
      packages: read
      pull-requests: write
    uses: ./.github/workflows/demo-api-promote-environment.yaml
    with:
      source_environment: aws-dev
      target_environment: aws-test
      qualification_mode: qualification-bundle
      qualification_bundle_path: ${{ needs.derive.outputs.qualification-bundle-path }}
      qualification_bundle_sha256: ${{ needs.derive.outputs.qualification-bundle-sha256 }}
      release_id: ${{ needs.derive.outputs.release-id }}
      control_plane_sha: ${{ needs.derive.outputs.control-plane-sha }}

  test-promotion-disabled:
    name: Report disabled aws-test Promotion preparation
    needs: derive
    if: >-
      needs.derive.outputs.recommended-action == 'prepare-test-promotion' &&
      needs.derive.outputs.operation != 'status' &&
      vars.DEMO_API_AWS_TEST_PROMOTION_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Publish safe disabled result
        run: |
          {
            echo "### demo-api aws-test Promotion"
            echo
            echo "- Status: \`automation-disabled\`"
            echo "- Release: \`${{ needs.derive.outputs.release-id }}\`"
            echo "- Recommended action: \`prepare-test-promotion\`"
            echo
            echo "Set \`DEMO_API_AWS_TEST_PROMOTION_ENABLED=true\` only when reviewed dev-to-test PR preparation is intended."
          } >> "${GITHUB_STEP_SUMMARY}"

  prepare-prod-promotion:
    name: Prepare approved aws-test to aws-prod Promotion
    needs: derive
    if: >-
      needs.derive.outputs.recommended-action == 'prepare-prod-promotion' &&
      needs.derive.outputs.operation != 'status' &&
      needs.derive.outputs.dispatch-authorized == 'true' &&
      vars.DEMO_API_AWS_PROD_PROMOTION_ENABLED == 'true'
    permissions:
      contents: write
      packages: read
      pull-requests: write
    uses: ./.github/workflows/demo-api-promote-environment.yaml
    with:
      source_environment: aws-test
      target_environment: aws-prod
      qualification_mode: qualification-bundle
      qualification_bundle_path: ${{ needs.derive.outputs.qualification-bundle-path }}
      qualification_bundle_sha256: ${{ needs.derive.outputs.qualification-bundle-sha256 }}
      release_id: ${{ needs.derive.outputs.release-id }}
      control_plane_sha: ${{ needs.derive.outputs.control-plane-sha }}

  prod-promotion-disabled:
    name: Report disabled aws-prod Promotion preparation
    needs: derive
    if: >-
      needs.derive.outputs.recommended-action == 'prepare-prod-promotion' &&
      needs.derive.outputs.operation != 'status' &&
      vars.DEMO_API_AWS_PROD_PROMOTION_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Publish safe disabled result
        run: |
          {
            echo "### demo-api aws-prod Promotion"
            echo
            echo "- Status: \`automation-disabled\`"
            echo "- Release: \`${{ needs.derive.outputs.release-id }}\`"
            echo "- Recommended action: \`prepare-prod-promotion\`"
            echo
            echo "Set \`DEMO_API_AWS_PROD_PROMOTION_ENABLED=true\` only when the protected aws-prod Environment reviewers are configured and production PR preparation is intended."
          } >> "${GITHUB_STEP_SUMMARY}"

  static-qualification:
    name: Produce same-run non-production static qualification
    needs: derive
    if: >-
      (needs.derive.outputs.recommended-action == 'qualify-aws-dev' ||
       needs.derive.outputs.recommended-action == 'qualify-aws-test') &&
      needs.derive.outputs.operation != 'status' &&
      needs.derive.outputs.dispatch-authorized == 'true' &&
      ((needs.derive.outputs.target-environment == 'aws-dev' &&
        vars.DEMO_API_AWS_DEV_QUALIFICATION_ENABLED == 'true') ||
       (needs.derive.outputs.target-environment == 'aws-test' &&
        vars.DEMO_API_AWS_TEST_QUALIFICATION_ENABLED == 'true'))
    permissions:
      contents: write
      packages: read
      pull-requests: write
    uses: ./.github/workflows/demo-api-record-release-evidence.yaml
    with:
      environment: ${{ needs.derive.outputs.target-environment }}
      mode: artifact-only
      expected_control_plane_sha: ${{ needs.derive.outputs.control-plane-sha }}

  qualification-disabled:
    name: Report disabled non-production qualification
    needs: derive
    if: >-
      (needs.derive.outputs.recommended-action == 'qualify-aws-dev' ||
       needs.derive.outputs.recommended-action == 'qualify-aws-test') &&
      needs.derive.outputs.operation != 'status' &&
      ((needs.derive.outputs.target-environment == 'aws-dev' &&
        vars.DEMO_API_AWS_DEV_QUALIFICATION_ENABLED != 'true') ||
       (needs.derive.outputs.target-environment == 'aws-test' &&
        vars.DEMO_API_AWS_TEST_QUALIFICATION_ENABLED != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Publish safe disabled result
        run: |
          {
            echo "### demo-api ${{ needs.derive.outputs.target-environment }} qualification"
            echo
            echo "- Status: \`automation-disabled\`"
            echo "- Release: \`${{ needs.derive.outputs.release-id }}\`"
            echo "- Recommended action: \`${{ needs.derive.outputs.recommended-action }}\`"
            echo
            echo "Enable only the matching environment qualification variable after its cluster and ephemeral trusted runner are ready."
          } >> "${GITHUB_STEP_SUMMARY}"

  runtime-qualification:
    name: Qualify non-production from the trusted executor
    needs:
      - derive
      - static-qualification
    if: >-
      needs.static-qualification.result == 'success' &&
      needs.static-qualification.outputs.status == 'qualified'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/demo-api-runtime-qualification.yaml
    with:
      environment: ${{ needs.derive.outputs.target-environment }}
      release_id: ${{ needs.derive.outputs.release-id }}
      control_plane_sha: ${{ needs.derive.outputs.control-plane-sha }}
      expected_source_commit: ${{ needs.derive.outputs.source-commit }}
      expected_image_digest: ${{ needs.derive.outputs.image-digest }}
      expected_release_file_sha256: ${{ needs.derive.outputs.release-file-sha256 }}

  record-qualification-bundle:
    name: Prepare reviewed non-production Qualification Bundle
    needs:
      - derive
      - static-qualification
      - runtime-qualification
    if: >-
      needs.runtime-qualification.result == 'success' &&
      needs.runtime-qualification.outputs.status == 'qualified'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/demo-api-record-qualification-bundle.yaml
    with:
      environment: ${{ needs.derive.outputs.target-environment }}
      release_id: ${{ needs.derive.outputs.release-id }}
      control_plane_sha: ${{ needs.derive.outputs.control-plane-sha }}
      static_artifact_name: ${{ needs.static-qualification.outputs.artifact_name }}
      runtime_artifact_name: ${{ needs.runtime-qualification.outputs.artifact_name }}

  record-attempt:
    name: Record secret-free orchestration Attempt
    needs:
      - derive
      - prepare-test-promotion
      - test-promotion-disabled
      - prepare-prod-promotion
      - prod-promotion-disabled
      - static-qualification
      - qualification-disabled
      - runtime-qualification
      - record-qualification-bundle
    if: always() && needs.derive.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the derived control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.derive.outputs.control-plane-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download same-run decision artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: demo-api-orchestration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orchestration

      - name: Assemble stage result facts
        env:
          TEST_PROMOTION_RESULT: ${{ needs.prepare-test-promotion.result }}
          TEST_PROMOTION_STATUS: ${{ needs.prepare-test-promotion.outputs.status }}
          TEST_PROMOTION_URL: ${{ needs.prepare-test-promotion.outputs.pr_url }}
          TEST_DISABLED_RESULT: ${{ needs.test-promotion-disabled.result }}
          PROD_PROMOTION_RESULT: ${{ needs.prepare-prod-promotion.result }}
          PROD_PROMOTION_STATUS: ${{ needs.prepare-prod-promotion.outputs.status }}
          PROD_PROMOTION_URL: ${{ needs.prepare-prod-promotion.outputs.pr_url }}
          PROD_DISABLED_RESULT: ${{ needs.prod-promotion-disabled.result }}
          STATIC_RESULT: ${{ needs.static-qualification.result }}
          STATIC_STATUS: ${{ needs.static-qualification.outputs.status }}
          QUALIFICATION_DISABLED_RESULT: ${{ needs.qualification-disabled.result }}
          RUNTIME_RESULT: ${{ needs.runtime-qualification.result }}
          RUNTIME_STATUS: ${{ needs.runtime-qualification.outputs.status }}
          RUNTIME_REASON: ${{ needs.runtime-qualification.outputs.reason }}
          BUNDLE_RESULT: ${{ needs.record-qualification-bundle.result }}
          BUNDLE_STATUS: ${{ needs.record-qualification-bundle.outputs.status }}
          BUNDLE_URL: ${{ needs.record-qualification-bundle.outputs.pr_url }}
          OUTPUT_FILE: ${{ runner.temp }}/stage-results.json
        run: |
          python3 - "${OUTPUT_FILE}" <<'PY'
          import json
          import os
          import sys

          def stage(prefix):
              return {
                  "result": os.environ.get(f"{prefix}_RESULT", ""),
                  "status": os.environ.get(f"{prefix}_STATUS", ""),
                  "reason": os.environ.get(f"{prefix}_REASON", ""),
                  "url": os.environ.get(f"{prefix}_URL", ""),
              }

          value = {
              "testPromotion": stage("TEST_PROMOTION"),
              "prodPromotion": stage("PROD_PROMOTION"),
              "static": stage("STATIC"),
              "runtime": stage("RUNTIME"),
              "bundle": stage("BUNDLE"),
              "disabled": {
                  "testPromotion": os.environ.get("TEST_DISABLED_RESULT", ""),
                  "prodPromotion": os.environ.get("PROD_DISABLED_RESULT", ""),
                  "qualification": os.environ.get("QUALIFICATION_DISABLED_RESULT", ""),
              },
          }
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump(value, output, indent=2, sort_keys=True)
              output.write("\n")
          PY

      - name: Resolve optional governed rollback handoff
        id: rollback
        if: >-
          (needs.derive.outputs.target-environment == 'aws-dev' ||
           needs.derive.outputs.target-environment == 'aws-test') &&
          contains(fromJSON('["rollout_unhealthy","analysis_failed","digest_mismatch","https_validation_failed"]'),
                   needs.runtime-qualification.outputs.reason)
        continue-on-error: true
        env:
          TARGET_ENVIRONMENT: ${{ needs.derive.outputs.target-environment }}
          RELEASE_ID: ${{ needs.derive.outputs.release-id }}
          FAILURE_REASON: ${{ needs.runtime-qualification.outputs.reason }}
        run: |
          ./scripts/resolve-demo-api-rollback-candidate.py \
            --environment "${TARGET_ENVIRONMENT}" \
            --failed-release-id "${RELEASE_ID}" \
            --failure-reason "${FAILURE_REASON}" \
            --base-revision "${{ needs.derive.outputs.control-plane-sha }}" \
            --output "${RUNNER_TEMP}/rollback-handoff.json"

      - name: Write and validate Attempt artifact
        env:
          OPERATION: ${{ needs.derive.outputs.operation }}
          CONTROL_PLANE_SHA: ${{ needs.derive.outputs.control-plane-sha }}
          STARTED_AT: ${{ needs.derive.outputs.started-at }}
          RETRY_RUN_ID: ${{ needs.derive.outputs.retry-run-id }}
          RETRY_RUN_ATTEMPT: ${{ needs.derive.outputs.retry-run-attempt }}
        run: |
          arguments=(
            --decision "${RUNNER_TEMP}/orchestration/demo-api-orchestration-decision.json"
            --stage-results "${RUNNER_TEMP}/stage-results.json"
            --operation "${OPERATION}"
            --control-plane-sha "${CONTROL_PLANE_SHA}"
            --repository "${GITHUB_REPOSITORY}"
            --run-id "${GITHUB_RUN_ID}"
            --run-attempt "${GITHUB_RUN_ATTEMPT}"
            --actor "${GITHUB_ACTOR}"
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            --started-at "${STARTED_AT}"
            --output "${RUNNER_TEMP}/attempt/result.json"
          )
          if [[ "${OPERATION}" == "retry" ]]; then
            arguments+=(
              --retry-run-id "${RETRY_RUN_ID}"
              --retry-run-attempt "${RETRY_RUN_ATTEMPT}"
            )
          fi
          if [[ -f "${RUNNER_TEMP}/rollback-handoff.json" ]]; then
            arguments+=(--rollback-handoff "${RUNNER_TEMP}/rollback-handoff.json")
          fi
          ./scripts/write-demo-api-orchestration-attempt.py "${arguments[@]}"
          ./scripts/validate-demo-api-orchestration-attempt.py \
            --attempt "${RUNNER_TEMP}/attempt/result.json"

      - name: Publish recovery summary
        run: |
          attempt="${RUNNER_TEMP}/attempt/result.json"
          {
            echo "### demo-api orchestration Attempt"
            echo
            echo "- Outcome: \`$(jq -r '.execution.outcome' "${attempt}")\`"
            echo "- Reason: \`$(jq -r '.execution.reason' "${attempt}")\`"
            echo "- Retry class: \`$(jq -r '.execution.retryClass' "${attempt}")\`"
            echo "- Recovery: \`$(jq -r '.execution.recommendedRecovery' "${attempt}")\`"
            if [[ "$(jq -r '.rollbackHandoff != null' "${attempt}")" == "true" ]]; then
              echo "- Rollback: governed manual handoff available in the Attempt artifact"
            fi
            echo
            echo "This short-retention diagnostic is not Promotion evidence and cannot dispatch rollback."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Attempt artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-api-orchestration-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attempt/result.json
          if-no-files-found: error
          retention-days: 14
