{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "demo-api.fullname" . }}
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
  annotations:
    {{- include "demo-api.deliveryAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.rollout.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "demo-api.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      maxSurge: {{ .Values.rollout.strategy.canary.maxSurge }}
      maxUnavailable: {{ .Values.rollout.strategy.canary.maxUnavailable }}
      {{- if .Values.rollout.strategy.canary.trafficRouting.nginx.enabled }}
      stableService: {{ .Values.rollout.strategy.canary.stableService }}
      canaryService: {{ .Values.rollout.strategy.canary.canaryService }}
      trafficRouting:
        nginx:
          stableIngress: {{ .Values.rollout.strategy.canary.trafficRouting.nginx.stableIngress }}
      {{- end }}
      {{- if .Values.rollout.strategy.canary.trafficRouting.alb.enabled }}
      stableService: {{ .Values.rollout.strategy.canary.stableService }}
      canaryService: {{ .Values.rollout.strategy.canary.canaryService }}
      trafficRouting:
        alb:
          ingress: {{ .Values.rollout.strategy.canary.trafficRouting.alb.ingress }}
          servicePort: {{ .Values.rollout.strategy.canary.trafficRouting.alb.servicePort }}
      {{- end }}
      steps:
        {{- range .Values.rollout.strategy.canary.steps }}
        {{- if hasKey . "analysis" }}
        - analysis:
            templates:
              {{- toYaml .analysis.templates | nindent 14 }}
            args:
              - name: expected-environment
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['platform.startup.dev/environment']
              - name: expected-version
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['platform.startup.dev/application-version']
              - name: image-digest
                {{- if $.Values.image.digest }}
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['platform.startup.dev/image-digest']
                {{- else }}
                value: ""
                {{- end }}
              - name: source-commit
                {{- if $.Values.delivery.sourceCommit }}
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['platform.startup.dev/source-commit']
                {{- else }}
                value: ""
                {{- end }}
        {{- else }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
        {{- end }}
  template:
    metadata:
      labels:
        {{- include "demo-api.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "demo-api.deliveryAnnotations" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "demo-api.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "demo-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: APP_VERSION
              value: {{ required "release.applicationVersion is required" .Values.release.applicationVersion | quote }}
            {{- include "demo-api.deliveryEnvironment" . | nindent 12 }}
            - name: DATABASE_ENABLED
              value: {{ .Values.database.enabled | quote }}
            - name: DATABASE_CONNECT_TIMEOUT_SECONDS
              value: {{ .Values.database.connectTimeoutSeconds | quote }}
            - name: DATABASE_RETRY_ATTEMPTS
              value: {{ .Values.database.retryAttempts | quote }}
            - name: DATABASE_RETRY_DELAY_SECONDS
              value: {{ .Values.database.retryDelaySeconds | quote }}
            - name: TRACING_ENABLED
              value: {{ .Values.telemetry.tracing.enabled | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ required "telemetry.tracing.endpoint is required" .Values.telemetry.tracing.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ required "telemetry.tracing.protocol is required" .Values.telemetry.tracing.protocol | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_TIMEOUT
              value: {{ .Values.telemetry.tracing.timeoutSeconds | quote }}
            {{- if .Values.database.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.secretName is required when database.enabled=true" .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.writableTmp.enabled }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if .Values.writableTmp.enabled }}
      volumes:
        - name: tmp
          emptyDir:
            medium: {{ .Values.writableTmp.medium | quote }}
            sizeLimit: {{ .Values.writableTmp.sizeLimit }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
