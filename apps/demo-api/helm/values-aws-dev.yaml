replicaCount: 2

image:
  repository: ghcr.io/sterlingaureum/startup-devops-baseline/demo-api
  tag: "sha-55ed0c9"
  digest: "sha256:40513d7c6713456df15e84a7acae763ede1fb427aff3b873a4e0546896e131d6"
  pullPolicy: IfNotPresent

rollout:
  enabled: false

analysis:
  enabled: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http.drop_invalid_header_fields.enabled=true
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

readinessProbe:
  timeoutSeconds: 10

env:
  APP_NAME: demo-api
  APP_VERSION: "sha-55ed0c9"
  APP_ENV: aws-dev

database:
  enabled: true
  secretName: demo-api-postgresql
  secretKey: DATABASE_URL
  connectTimeoutSeconds: 2
  retryAttempts: 3
  retryDelaySeconds: 1

delivery:
  sourceRepository: "SterlingAureum/startup-devops-baseline"
  sourceCommit: "55ed0c91839345ad915ac55afbf63643354617b3"
  workflowRunId: "30373150983"
