replicaCount: 3

image:
  repository: ghcr.io/sterlingaureum/startup-devops-baseline/demo-api
  tag: "sha-3e50802"
  digest: ""
  pullPolicy: IfNotPresent

release:
  applicationVersion: "sha-3e50802"

delivery:
  sourceRepository: ""
  sourceCommit: ""
  workflowRunId: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

rollout:
  enabled: true
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      stableService: demo-api-stable
      canaryService: demo-api-canary
      trafficRouting:
        nginx:
          enabled: true
          stableIngress: demo-api
        alb:
          enabled: false
          ingress: demo-api
          servicePort: 80
      steps:
        - setWeight: 20
        - pause:
            duration: 60s
        - analysis:
            templates:
              - templateName: demo-api-canary-health
        - setWeight: 50
        - pause: {}
        - setWeight: 100
serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

writableTmp:
  enabled: true
  medium: Memory
  sizeLimit: 64Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: demo-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /ready
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

env:
  APP_NAME: demo-api
  APP_ENV: local

database:
  enabled: false
  secretName: ""
  secretKey: DATABASE_URL
  connectTimeoutSeconds: 2
  retryAttempts: 3
  retryDelaySeconds: 1

telemetry:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 15s
      scrapeTimeout: 10s
      sampleLimit: 50000
      targetLimit: 10
      labelLimit: 100
      labelNameLengthLimit: 128
      labelValueLengthLimit: 512

nodeSelector: {}
tolerations: []
affinity: {}

analysis:
  enabled: true
  provider: prometheus
  prometheus:
    address: http://observability-metrics-prometheus.observability.svc.cluster.local:9090
  web:
    readyUrl: http://demo-api-canary.startup-apps.svc.cluster.local/ready
    versionUrl: http://demo-api-canary.startup-apps.svc.cluster.local/version
    interval: 15s
    count: 3
    failureLimit: 1
  metrics:
    canaryTargetUp:
      interval: 15s
      count: 2
      failureLimit: 1
