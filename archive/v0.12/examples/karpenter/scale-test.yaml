apiVersion: v1
kind: Namespace
metadata:
  name: karpenter-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter-scale-test
  namespace: karpenter-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: karpenter-scale-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karpenter-scale-test
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: karpenter-scale-test
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        karpenter.sh/nodepool: application-ondemand
        workload: application
      tolerations:
        - key: dedicated
          operator: Equal
          value: application
          effect: NoSchedule
      containers:
        - name: nginx
          image: public.ecr.aws/docker/library/nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      terminationGracePeriodSeconds: 10
