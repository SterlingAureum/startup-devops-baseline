apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgresql-baseline-backup
  namespace: data-platform
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: startup-devops-baseline
    platform.startup.dev/environment: aws-dev
spec:
  configuration:
    # Rendered in the live resource by deploy-aws-dev-root-app.sh from the
    # Terraform output cnpg_backup_bucket_name. Argo CD preserves this field.
    destinationPath: "s3://__CNPG_BACKUP_BUCKET__/postgresql-baseline"
    s3Credentials:
      inheritFromIAMRole: true
    wal:
      compression: lz4
      maxParallel: 2
    data:
      compression: lz4
      jobs: 2
  retentionPolicy: "7d"
  instanceSidecarConfiguration:
    retentionPolicyIntervalSeconds: 1800
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
