apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: default
  source:
    repoURL: https://github.com/SterlingAureum/startup-devops-baseline.git
    targetRevision: feature/v0.7-cicd-gitops-promotion
    path: clusters/aws-dev/data-platform/postgresql
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: data-platform
  # deploy-aws-dev-root-app.sh replaces only this live ObjectStore field with
  # the Terraform-created bucket. All other backup configuration remains GitOps
  # managed and self-healed.
  ignoreDifferences:
    - group: barmancloud.cnpg.io
      kind: ObjectStore
      name: postgresql-baseline-backup
      namespace: data-platform
      jsonPointers:
        - /spec/configuration/destinationPath
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
