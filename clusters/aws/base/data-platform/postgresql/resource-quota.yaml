apiVersion: v1
kind: ResourceQuota
metadata:
  name: data-platform
  namespace: data-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
    services: "20"
    configmaps: "30"
    secrets: "50"
    persistentvolumeclaims: "20"
    requests.storage: 200Gi
