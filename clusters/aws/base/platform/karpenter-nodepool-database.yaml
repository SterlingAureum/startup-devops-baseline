apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: database-ondemand
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  template:
    metadata:
      labels:
        workload: database
        capacity-owner: karpenter
        capacity-tier: on-demand
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: database
      taints:
        - key: dedicated
          value: database
          effect: NoSchedule
      expireAfter: Never
      terminationGracePeriod: 30m
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-east-1a
            - us-east-1b
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            - c
            - m
        - key: karpenter.k8s.aws/instance-generation
          operator: Gte
          values:
            - "6"
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values:
            - "2"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
    budgets:
      - nodes: "1"
  limits:
    cpu: "6"
    memory: 24Gi
    nodes: 3
  weight: 20
