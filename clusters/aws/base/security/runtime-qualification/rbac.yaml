apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-api-runtime-qualification
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-api-runtime-qualification
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
subjects:
  - kind: Group
    name: demo-api-runtime-qualification
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-api-runtime-qualification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observability-runtime-qualification
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheuses", "alertmanagers", "servicemonitors", "podmonitors", "prometheusrules"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-runtime-qualification
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
subjects:
  - kind: Group
    name: demo-api-runtime-qualification
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observability-runtime-qualification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-api-runtime-qualification
  namespace: startup-apps
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
rules:
  - apiGroups: [""]
    resources: ["events", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["analysisruns", "rollouts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-api-runtime-qualification
  namespace: startup-apps
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
subjects:
  - kind: Group
    name: demo-api-runtime-qualification
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-api-runtime-qualification
