apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../base/platform/runtime-qualification-rbac
labels:
  - pairs:
      platform.startup.dev/environment: aws-dev
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: monitoring-aws-dev
    patch: |-
      - op: add
        path: /spec/source/helm/valuesObject/grafana/admin
        value:
          existingSecret: observability-grafana-admin
          userKey: admin-user
          passwordKey: admin-password
  - target:
      kind: Application
      name: demo-api-aws-dev
    patch: |-
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: apps
          kind: Deployment
          name: demo-api
          namespace: startup-apps
          jsonPointers: [/spec/template/metadata/annotations/platform.startup.dev~1demo-db-version]
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: argoproj.io
          kind: Rollout
          name: demo-api
          namespace: startup-apps
          jsonPointers: [/spec/template/metadata/annotations/platform.startup.dev~1demo-db-version]
