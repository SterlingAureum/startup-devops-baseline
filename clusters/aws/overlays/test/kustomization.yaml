apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../base/platform/runtime-qualification-rbac
labels:
  - pairs:
      platform.startup.dev/environment: aws-test
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: monitoring-aws-dev
    patch: |-
      - op: replace
        path: /metadata/name
        value: monitoring-aws-test
      - op: replace
        path: /spec/source/helm/valuesObject/prometheus/prometheusSpec/retention
        value: 48h
      - op: replace
        path: /spec/source/helm/valuesObject/alertmanager/alertmanagerSpec/retention
        value: 48h
      - op: replace
        path: /spec/source/helm/valuesObject/prometheus/prometheusSpec/externalLabels/environment
        value: aws-test
      - op: replace
        path: /spec/source/helm/valuesObject/prometheus/prometheusSpec/externalLabels/cluster
        value: startup-devops-baseline-test
      - op: replace
        path: /spec/source/helm/valuesObject/extraManifests/0/parameters/tagSpecification_2
        value: Environment=test
      - op: replace
        path: /spec/source/helm/valuesObject/extraManifests/1/parameters/tagSpecification_2
        value: Environment=test
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: observability-views-aws-dev
    patch: |-
      - op: replace
        path: /metadata/name
        value: observability-views-aws-test
      - op: replace
        path: /spec/source/helm/parameters/0/value
        value: aws-test
      - op: replace
        path: /spec/source/helm/parameters/1/value
        value: startup-devops-baseline-test
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: runtime-qualification-rbac-aws-dev
    patch: |-
      - op: replace
        path: /metadata/name
        value: runtime-qualification-rbac-aws-test
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: application-admission-policies-aws-dev
    patch: |-
      - op: replace
        path: /metadata/name
        value: application-admission-policies-aws-test
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: data-platform-network-policy-aws-dev
    patch: |-
      - op: replace
        path: /metadata/name
        value: data-platform-network-policy-aws-test
      - op: replace
        path: /spec/source/path
        value: clusters/aws/overlays/test/security/network-policies/data-platform
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: demo-api-aws-dev
    patch: |-
      - op: replace
        path: /metadata/name
        value: demo-api-aws-test
      - op: replace
        path: /spec/source/helm/valueFiles/0
        value: values/environments/aws-test.yaml
      - op: replace
        path: /spec/source/helm/valueFiles/1
        value: values/releases/aws-test.yaml
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: external-secrets-startup-apps
    patch: |-
      - op: replace
        path: /spec/source/path
        value: clusters/aws/overlays/test/security/external-secrets/startup-apps
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: namespace-guardrails-aws-dev
    patch: |-
      - op: replace
        path: /metadata/name
        value: namespace-guardrails-aws-test
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: postgresql-baseline
    patch: |-
      - op: replace
        path: /spec/source/path
        value: clusters/aws/overlays/test/data-platform/postgresql
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: startup-apps-network-policy-aws-dev
    patch: |-
      - op: replace
        path: /metadata/name
        value: startup-apps-network-policy-aws-test
      - op: replace
        path: /spec/source/path
        value: clusters/aws/overlays/test/security/network-policies/startup-apps
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: aws-load-balancer-controller
    patch: |-
      - op: replace
        path: /spec/source/helm/valuesObject/clusterName
        value: startup-devops-baseline-test
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: karpenter
    patch: |-
      - op: replace
        path: /spec/source/helm/valuesObject/settings/clusterName
        value: startup-devops-baseline-test
      - op: replace
        path: /spec/source/helm/valuesObject/settings/interruptionQueue
        value: startup-devops-baseline-test-karpenter-interruptions
  - target:
      group: karpenter.k8s.aws
      version: v1
      kind: EC2NodeClass
      name: application
    patch: |-
      - op: replace
        path: /spec/role
        value: startup-devops-baseline-test-karpenter-node-role
      - op: replace
        path: /spec/subnetSelectorTerms/0/tags/karpenter.sh~1discovery
        value: startup-devops-baseline-test
      - op: replace
        path: /spec/securityGroupSelectorTerms/0/tags/karpenter.sh~1discovery
        value: startup-devops-baseline-test
      - op: replace
        path: /spec/tags/Name
        value: startup-devops-baseline-test-karpenter-application
      - op: replace
        path: /spec/tags/Environment
        value: test
  - target:
      group: karpenter.k8s.aws
      version: v1
      kind: EC2NodeClass
      name: database
    patch: |-
      - op: replace
        path: /spec/role
        value: startup-devops-baseline-test-karpenter-node-role
      - op: replace
        path: /spec/subnetSelectorTerms/0/tags/karpenter.sh~1discovery
        value: startup-devops-baseline-test
      - op: replace
        path: /spec/securityGroupSelectorTerms/0/tags/karpenter.sh~1discovery
        value: startup-devops-baseline-test
      - op: replace
        path: /spec/tags/Name
        value: startup-devops-baseline-test-karpenter-database
      - op: replace
        path: /spec/tags/Environment
        value: test
  - target:
      group: karpenter.k8s.aws
      version: v1
      kind: EC2NodeClass
      name: application-fis
    patch: |-
      - op: replace
        path: /spec/role
        value: startup-devops-baseline-test-karpenter-node-role
      - op: replace
        path: /spec/subnetSelectorTerms/0/tags/karpenter.sh~1discovery
        value: startup-devops-baseline-test
      - op: replace
        path: /spec/securityGroupSelectorTerms/0/tags/karpenter.sh~1discovery
        value: startup-devops-baseline-test
      - op: replace
        path: /spec/tags/Name
        value: startup-devops-baseline-test-karpenter-application-fis
      - op: replace
        path: /spec/tags/Environment
        value: test
      - op: replace
        path: /spec/tags/KarpenterFISTest
        value: startup-devops-baseline-test-spot-interruption
