apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../base/security/external-secrets/startup-apps
labels:
  - pairs:
      platform.startup.dev/environment: aws-test
patches:
  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: demo-api-postgresql
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: startup-devops-baseline-test/demo-api/postgresql
