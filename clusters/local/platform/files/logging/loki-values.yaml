fullnameOverride: observability-logs
commonLabels:
  app.kubernetes.io/part-of: startup-devops-baseline
  platform.startup.dev/managed-by: gitops

deploymentMode: Monolithic

defaults:
  automountServiceAccountToken: false

loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: filesystem
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    discover_service_name: []
    retention_period: 24h
    max_query_lookback: 24h
  analytics:
    reporting_enabled: false
  tracing:
    enabled: false

singleBinary:
  replicas: 1
  podDisruptionBudget:
    enabled: false
  persistence:
    enabled: false
    dataVolumeParameters:
      emptyDir:
        sizeLimit: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
      ephemeral-storage: 2Gi

gateway:
  enabled: true
  replicas: 1
  verboseLogging: false
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

podDisruptionBudget:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: observability-logs-cluster-only
      namespace: observability
      labels:
        app.kubernetes.io/part-of: startup-devops-baseline
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: observability-logs
      policyTypes:
        - Ingress
        - Egress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: observability
          ports:
            - protocol: TCP
              port: 8080
            - protocol: TCP
              port: 3100
            - protocol: TCP
              port: 9095
            - protocol: TCP
              port: 7946
            - protocol: UDP
              port: 7946
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: observability
              podSelector:
                matchLabels:
                  app.kubernetes.io/instance: observability-logs
          ports:
            - protocol: TCP
              port: 3100
            - protocol: TCP
              port: 9095
            - protocol: TCP
              port: 7946
            - protocol: UDP
              port: 7946
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
