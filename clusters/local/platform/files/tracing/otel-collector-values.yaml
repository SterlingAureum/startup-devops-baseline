fullnameOverride: observability-otel-collector

mode: deployment
replicaCount: 1
revisionHistoryLimit: 2

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
  tag: "0.159.0"
  pullPolicy: IfNotPresent

command:
  name: otelcol-k8s

alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    otlp:
      protocols:
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 75
      spike_limit_percentage: 20
    batch:
      timeout: 1s
      send_batch_size: 256
      send_batch_max_size: 512
  exporters:
    otlp_http/tempo:
      endpoint: http://observability-tempo.observability.svc.cluster.local:4318
      sending_queue:
        enabled: true
        num_consumers: 1
        queue_size: 256
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_interval: 5s
        max_elapsed_time: 30s
  service:
    extensions:
      - health_check
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp_http/tempo
    telemetry:
      logs:
        level: info

ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    hostPort: 4318
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: false

service:
  type: ClusterIP

ingress:
  enabled: false

httproute:
  enabled: false

serviceAccount:
  create: true
  automountServiceAccountToken: false

clusterRole:
  create: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 96Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
    ephemeral-storage: 256Mi

useGOMEMLIMIT: true
hostNetwork: false
hostPID: false

podDisruptionBudget:
  enabled: false

autoscaling:
  enabled: false

serviceMonitor:
  enabled: false

podMonitor:
  enabled: false

networkPolicy:
  enabled: false

extraManifests:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: observability-otel-collector-cluster-only
      namespace: observability
      labels:
        app.kubernetes.io/part-of: startup-devops-baseline
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: observability-otel-collector
      policyTypes:
        - Ingress
        - Egress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: startup-apps
          ports:
            - protocol: TCP
              port: 4318
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: observability
              podSelector:
                matchLabels:
                  app.kubernetes.io/instance: observability-tempo
          ports:
            - protocol: TCP
              port: 4318
