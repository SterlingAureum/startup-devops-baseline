apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.externalCharts.monitoring.repoURL | quote }}
    chart: kube-prometheus-stack
    targetRevision: {{ .Values.externalCharts.monitoring.version | quote }}
    helm:
      releaseName: observability-metrics
      valuesObject:
        fullnameOverride: observability-metrics
        commonLabels:
          app.kubernetes.io/part-of: startup-devops-baseline
          platform.startup.dev/managed-by: gitops
        defaultRules:
          create: false
        alertmanager:
          enabled: false
        grafana:
          enabled: true
          defaultDashboardsEnabled: false
          ingress:
            enabled: false
          service:
            type: ClusterIP
          persistence:
            enabled: false
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: observability
            datasources:
              enabled: true
              defaultDatasourceEnabled: true
              uid: prometheus
          grafana.ini:
            analytics:
              check_for_updates: false
              reporting_enabled: false
            auth.anonymous:
              enabled: false
            users:
              allow_sign_up: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        windowsMonitoring:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        prometheusOperator:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        kube-state-metrics:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
        prometheus-node-exporter:
          tolerations:
            - operator: Exists
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        prometheus:
          ingress:
            enabled: false
          service:
            type: ClusterIP
          prometheusSpec:
            replicas: 1
            retention: 6h
            retentionSize: 2GiB
            enableAdminAPI: false
            externalLabels:
              environment: local
              cluster: startup-devops-local
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelector: {}
            serviceMonitorNamespaceSelector: {}
            podMonitorSelectorNilUsesHelmValues: false
            podMonitorSelector: {}
            podMonitorNamespaceSelector: {}
            ruleSelectorNilUsesHelmValues: false
            ruleSelector: {}
            ruleNamespaceSelector: {}
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 1Gi
            storageSpec:
              emptyDir:
                sizeLimit: 2Gi
        extraManifests:
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: prometheus-cluster-only
              namespace: observability
              labels:
                app.kubernetes.io/part-of: startup-devops-baseline
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
              policyTypes:
                - Ingress
                - Egress
              ingress:
                - from:
                    - namespaceSelector: {}
                  ports:
                    - protocol: TCP
                      port: 9090
              egress:
                - to:
                    - namespaceSelector: {}
                - to:
                    - ipBlock:
                        cidr: 0.0.0.0/0
                  ports:
                    - protocol: TCP
                      port: 443
                    - protocol: TCP
                      port: 10249
                    - protocol: TCP
                      port: 10250
                    - protocol: TCP
                      port: 9100
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: grafana-cluster-only
              namespace: observability
              labels:
                app.kubernetes.io/part-of: startup-devops-baseline
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: grafana
              policyTypes:
                - Ingress
                - Egress
              ingress:
                - from:
                    - namespaceSelector: {}
                  ports:
                    - protocol: TCP
                      port: 3000
              egress:
                - to:
                    - ipBlock:
                        cidr: 0.0.0.0/0
                  ports:
                    - protocol: TCP
                      port: 443
                - to:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: observability
                  ports:
                    - protocol: TCP
                      port: 9090
                - to:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: kube-system
                  ports:
                    - protocol: UDP
                      port: 53
                    - protocol: TCP
                      port: 53
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: startup-devops-baseline
        platform.startup.dev/tier: observability
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
