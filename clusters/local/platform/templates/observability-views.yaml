apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-views
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.git.repoURL | quote }}
    targetRevision: {{ .Values.git.targetRevision | quote }}
    path: platform/observability/helm
    helm:
      releaseName: observability-views
      parameters:
        - name: environment
          value: local
        - name: cluster
          value: startup-devops-local
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
