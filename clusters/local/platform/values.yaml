git:
  repoURL: https://github.com/SterlingAureum/startup-devops-baseline.git
  targetRevision: HEAD

demoApi:
  localImage:
    enabled: false
    repository: startup-devops-baseline/demo-api
    tag: ""
    pullPolicy: Never
    applicationVersion: ""
  rehearsalFault:
    mode: disabled
    tokenSha256: ""
  tracing:
    enabled: true
    endpoint: http://observability-otel-collector.observability.svc.cluster.local:4318/v1/traces
    protocol: http/protobuf
    timeoutSeconds: 5

externalCharts:
  argoRollouts:
    repoURL: https://argoproj.github.io/argo-helm
    version: 2.41.1
  ingressNginx:
    repoURL: https://kubernetes.github.io/ingress-nginx
    version: 4.11.3
  monitoring:
    repoURL: https://prometheus-community.github.io/helm-charts
    version: 88.5.0
  loki:
    repoURL: https://grafana-community.github.io/helm-charts
    version: 18.11.3
  alloy:
    repoURL: https://grafana.github.io/helm-charts
    version: 1.11.0
  otelCollector:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.172.0
