# Run 'python3 scripts/ops/cli.py init-config' to create your personal inventory.
# By default it lives in ~/.config/startup-devops-baseline/environments.yaml.
# Relative tfvars, backend config and state file paths start at this inventory's directory.
# terraform.root is relative to the CLI repository. Use 'show --env NAME' to see resolved input paths.
# No access keys, tokens, passwords, kubeconfig or Terraform state belong here.
schema_version: 2
# --env selects a key exactly. You may rename a key without renaming any resources.
# Every entry explicitly selects a delivery_environment in delivery/standard/config.json.
# Argo CD defaults come from config/argocd-bootstrap.yaml. Set argocd.manifest in an entry to override.
# For standard AWS entries the Terraform root identifies the physical dev/test target.
environments:
  local:
    driver: kind
    delivery_environment: local
    timeout: 900
    kind:
      cluster: startup-devops-baseline
      node_image: kindest/node:v1.30.0
      http_port: 8080
      https_port: 8443
    gitops:
      repository: https://github.com/SterlingAureum/startup-devops-baseline.git
      # A real deploy/up needs --revision or a revision here.
      revision: null
      root_application: startup-devops-root
      # Parent-chart wiring, not application parameters. These placeholders
      # are expanded only after the Git ref has resolved to an immutable commit.
      parameters:
        git.repoURL: '${repository}'
        git.targetRevision: '${revision}'
  aws-dev:
    # Offline preflight can check repository examples or these private files.
    driver: aws
    delivery_environment: aws-dev
    aws:
      expected_account_id: '123456789012'
      region: us-east-1
      profile: baseline-dev
    terraform:
      root: infra/terraform/aws/environments/dev
      # Start from infra/terraform/aws/environments/dev/terraform.tfvars.example.
      variables_file: aws-dev.tfvars
      backend:
        type: s3
        # Private copy of infra/terraform/aws/backend-config/dev.s3.tfbackend.example.
        config_file: aws-dev.tfbackend
  aws-test:
    driver: aws
    delivery_environment: aws-test
    aws:
      expected_account_id: '123456789012'
      region: us-east-1
      profile: baseline-test
    terraform:
      root: infra/terraform/aws/environments/test
      # Start from infra/terraform/aws/environments/test/terraform.tfvars.example.
      variables_file: aws-test.tfvars
      backend:
        type: local
        # Terraform writes the state itself here. For an existing environment use its current file.
        path: ~/.local/state/startup-devops-baseline/aws-test/terraform.tfstate
