# Run 'python3 scripts/ops/cli.py init-config' to create your personal inventory.
# By default it lives in ~/.config/startup-devops-baseline/environments.yaml.
# Copy the AWS input templates listed below to their personal paths and fill them in.
# Relative input paths start in the directory containing the inventory selected by --config.
# For example, with --config /srv/baseline/environments.yaml, aws-test.tfvars means /srv/baseline/aws-test.tfvars.
# You can also use a subdirectory (inputs/aws-test.tfvars), an absolute path, or a path starting with ~/.
# terraform.root is relative to the CLI repository. To see the resolved paths, run:
# python3 scripts/ops/cli.py show --env aws-test   # add --config FILE for a custom inventory
# No access keys, tokens, passwords, kubeconfig or Terraform state belong here.
schema_version: 2
# --env selects a key exactly. You may rename a key without renaming any resources.
# Every entry explicitly selects a delivery_environment in delivery/standard/config.json.
# Argo CD defaults come from config/argocd-bootstrap.yaml. Set argocd.manifest in an entry to override.
# For standard AWS entries the Terraform root identifies the physical dev/test target.
environments:
  local:
    driver: kind
    delivery_environment: local
    timeout: 900
    kind:
      cluster: startup-devops-baseline
      node_image: kindest/node:v1.30.0
      http_port: 8080
      https_port: 8443
    gitops:
      repository: https://github.com/SterlingAureum/startup-devops-baseline.git
      # A real deploy/up needs --revision or a revision here.
      revision: null
      root_application: startup-devops-root
      # Parent-chart wiring, not application parameters. These placeholders
      # are expanded only after the Git ref has resolved to an immutable commit.
      parameters:
        git.repoURL: '${repository}'
        git.targetRevision: '${revision}'
  aws-dev:
    # Select when creating dev. Use none to omit the database stack and its dedicated AWS resources.
    database:
      mode: cnpg
    # Offline preflight can check repository examples or these private files.
    driver: aws
    delivery_environment: aws-dev
    aws:
      expected_account_id: '123456789012'
      region: us-east-1
      profile: baseline-dev
    terraform:
      root: infra/terraform/aws/environments/dev
      # Copy infra/terraform/aws/environments/dev/terraform.tfvars.example
      # to ~/.config/startup-devops-baseline/aws-dev.tfvars with the default inventory.
      variables_file: aws-dev.tfvars
      backend:
        type: s3
        # Copy infra/terraform/aws/backend-config/dev.s3.tfbackend.example
        # to ~/.config/startup-devops-baseline/aws-dev.tfbackend with the default inventory.
        config_file: aws-dev.tfbackend
  aws-test:
    driver: aws
    delivery_environment: aws-test
    aws:
      expected_account_id: '123456789012'
      region: us-east-1
      profile: baseline-test
    terraform:
      root: infra/terraform/aws/environments/test
      # Copy infra/terraform/aws/environments/test/terraform.tfvars.example
      # to ~/.config/startup-devops-baseline/aws-test.tfvars with the default inventory.
      variables_file: aws-test.tfvars
      backend:
        type: s3
        # Copy infra/terraform/aws/backend-config/test.s3.tfbackend.example
        # to ~/.config/startup-devops-baseline/aws-test.tfbackend with the default inventory.
        config_file: aws-test.tfbackend
