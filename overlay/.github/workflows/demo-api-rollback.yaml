name: demo-api GitOps rollback

on:
  workflow_dispatch:
    inputs:
      rollback_to_revision:
        description: Full historical values-only desired-state commit to restore
        required: true
        type: string
      rollback_base_branch:
        description: Branch that will receive the rollback pull request
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: demo-api-rollback-${{ inputs.rollback_base_branch }}
  cancel-in-progress: false

jobs:
  prepare-rollback:
    name: Create aws-dev rollback PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      ROLLBACK_TO_REVISION: ${{ inputs.rollback_to_revision }}
      ROLLBACK_BASE_BRANCH: ${{ inputs.rollback_base_branch }}
      ENVIRONMENT_VALUES_PATH: apps/demo-api/helm/values/environments/aws-dev.yaml
      VALUES_PATH: apps/demo-api/helm/values/releases/aws-dev.yaml
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Prepare rollback branch
        id: rollback
        env:
          EXPECTED_SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          base_branch="${ROLLBACK_BASE_BRANCH}"
          target_revision="${ROLLBACK_TO_REVISION}"

          if ! git check-ref-format "refs/heads/${base_branch}" >/dev/null 2>&1; then
            echo "::error::Invalid rollback base branch: ${base_branch}"
            exit 1
          fi

          if [[ ! "${target_revision}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::rollback_to_revision must be a full lowercase Git commit SHA."
            exit 1
          fi

          if ! git ls-remote --exit-code --heads origin \
            "refs/heads/${base_branch}" >/dev/null; then
            echo "::error::Rollback base branch does not exist: ${base_branch}"
            exit 1
          fi

          git fetch --no-tags origin \
            "+refs/heads/${base_branch}:refs/remotes/origin/${base_branch}"

          if ! git cat-file -e "${target_revision}^{commit}" 2>/dev/null; then
            echo "::error::Rollback target is unavailable in repository history."
            exit 1
          fi

          if ! git merge-base --is-ancestor \
            "${target_revision}" "origin/${base_branch}"; then
            echo "::error::Rollback target is not contained in ${base_branch}."
            exit 1
          fi

          base_revision="$(git rev-parse "origin/${base_branch}")"
          rollback_branch="rollback/demo-api-${target_revision:0:12}-from-${base_revision:0:12}"

          if git ls-remote --exit-code --heads origin \
            "refs/heads/${rollback_branch}" >/dev/null 2>&1; then
            git fetch --no-tags origin \
              "+refs/heads/${rollback_branch}:refs/remotes/origin/${rollback_branch}"
            git switch --create "${rollback_branch}" \
              --track "origin/${rollback_branch}"
          else
            git switch --create "${rollback_branch}" "origin/${base_branch}"
          fi

          ROLLBACK_BASE_REVISION="origin/${base_branch}" \
          ROLLBACK_TO_REVISION="${target_revision}" \
          EXPECTED_SOURCE_REPOSITORY="${EXPECTED_SOURCE_REPOSITORY}" \
          VALUES_PATH="${VALUES_PATH}" \
            ./scripts/prepare-demo-api-rollback.sh

          helm lint apps/demo-api/helm \
            --values "${ENVIRONMENT_VALUES_PATH}" \
            --values "${VALUES_PATH}"
          helm template demo-api apps/demo-api/helm \
            --values "${ENVIRONMENT_VALUES_PATH}" \
            --values "${VALUES_PATH}" >/dev/null
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          changed=false
          if ! git diff --quiet -- "${VALUES_PATH}"; then
            git add "${VALUES_PATH}"
            git commit -m "release: roll back aws-dev demo-api to ${target_revision:0:12}"
            git push origin "HEAD:refs/heads/${rollback_branch}"
            changed=true
          fi

          echo "base-branch=${base_branch}" >> "${GITHUB_OUTPUT}"
          echo "base-revision=${base_revision}" >> "${GITHUB_OUTPUT}"
          echo "rollback-branch=${rollback_branch}" >> "${GITHUB_OUTPUT}"
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      - name: Create or reuse rollback pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ steps.rollback.outputs.base-branch }}
          ROLLBACK_BRANCH: ${{ steps.rollback.outputs.rollback-branch }}
          TARGET_REVISION: ${{ steps.rollback.outputs.target-revision }}
          IMAGE_TAG: ${{ steps.rollback.outputs.image-tag }}
          IMAGE_DIGEST: ${{ steps.rollback.outputs.image-digest }}
          SOURCE_COMMIT: ${{ steps.rollback.outputs.source-commit }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

          if git diff --quiet "origin/${BASE_BRANCH}" HEAD; then
            echo "status=already-restored" >> "${GITHUB_OUTPUT}"
            echo "url=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mapfile -t changed_files < <(
            git diff --name-only "origin/${BASE_BRANCH}" HEAD
          )
          if [[ "${#changed_files[@]}" != "1" || \
                "${changed_files[0]}" != "${VALUES_PATH}" ]]; then
            echo "::error::Rollback branch must differ from the base only in ${VALUES_PATH}."
            printf 'Unexpected rollback diff: %s\n' "${changed_files[@]}"
            exit 1
          fi

          pr_url="$(
            gh pr list \
              --state open \
              --base "${BASE_BRANCH}" \
              --head "${ROLLBACK_BRANCH}" \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [[ -z "${pr_url}" ]]; then
            body_file="$(mktemp)"
            {
              echo "## aws-dev demo-api rollback"
              echo
              echo "- Historical desired-state commit: \`${TARGET_REVISION}\`"
              echo "- Restored image tag: \`${IMAGE_TAG}\`"
              echo "- Restored image digest: \`${IMAGE_DIGEST}\`"
              echo "- Restored source commit: \`${SOURCE_COMMIT}\`"
              echo "- Rollback workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo "This PR restores a previously reviewed values file. It changes Git desired state only; merge remains a human decision and Argo CD performs reconciliation."
            } > "${body_file}"

            if ! pr_url="$(
              gh pr create \
                --base "${BASE_BRANCH}" \
                --head "${ROLLBACK_BRANCH}" \
                --title "release: roll back aws-dev demo-api to ${IMAGE_TAG}" \
                --body-file "${body_file}"
            )"; then
              echo "::error::Could not create the rollback PR. Enable repository Actions permission to create pull requests, then rerun this job."
              exit 1
            fi
            status=created
          else
            status=reused
          fi

          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "url=${pr_url}" >> "${GITHUB_OUTPUT}"

      - name: Publish rollback summary
        env:
          PR_STATUS: ${{ steps.pull-request.outputs.status }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
          BASE_BRANCH: ${{ steps.rollback.outputs.base-branch }}
          ROLLBACK_BRANCH: ${{ steps.rollback.outputs.rollback-branch }}
          TARGET_REVISION: ${{ steps.rollback.outputs.target-revision }}
          IMAGE_TAG: ${{ steps.rollback.outputs.image-tag }}
          IMAGE_DIGEST: ${{ steps.rollback.outputs.image-digest }}
        run: |
          {
            echo "### aws-dev GitOps rollback"
            echo
            echo "- Status: \`${PR_STATUS}\`"
            echo "- Historical desired state: \`${TARGET_REVISION}\`"
            echo "- Restored image: \`${IMAGE_TAG}@${IMAGE_DIGEST}\`"
            echo "- Base branch: \`${BASE_BRANCH}\`"
            echo "- Rollback branch: \`${ROLLBACK_BRANCH}\`"
            if [[ -n "${PR_URL}" ]]; then
              echo "- Pull request: ${PR_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
