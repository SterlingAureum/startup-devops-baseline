apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../base/security/network-policies/startup-apps
labels:
  - pairs:
      platform.startup.dev/environment: aws-test
patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: allow-alb-to-demo-api
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/ipBlock/cidr
        value: 10.30.0.0/24
      - op: replace
        path: /spec/ingress/0/from/1/ipBlock/cidr
        value: 10.30.1.0/24
