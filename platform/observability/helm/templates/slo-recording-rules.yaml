apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-api-slo-recording-rules
  labels:
    app.kubernetes.io/name: startup-devops-observability-views
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: slo-recording-rules
    app.kubernetes.io/part-of: startup-devops-baseline
    platform.startup.dev/environment: {{ .Values.environment | quote }}
spec:
  groups:
    - name: demo-api.slo.v0.11.7.0
      interval: {{ .Values.slo.evaluationInterval }}
      rules:
        - record: demo_api:slo_http_requests:rate30d
          expr: |
            sum by (deployment_environment_name, service_name, service_version, platform_release_id) (
              rate(demo_api_http_requests_total{
                job=~"demo-api|demo-api-stable|demo-api-canary",
                method={{ .Values.slo.method | quote }},
                route={{ .Values.slo.route | quote }}
              }[{{ .Values.slo.rollingWindow }}])
            )
        - record: demo_api:slo_http_5xx:rate30d
          expr: |
            sum by (deployment_environment_name, service_name, service_version, platform_release_id) (
              rate(demo_api_http_requests_total{
                job=~"demo-api|demo-api-stable|demo-api-canary",
                method={{ .Values.slo.method | quote }},
                route={{ .Values.slo.route | quote }},
                status_class="5xx"
              }[{{ .Values.slo.rollingWindow }}])
            )
            or
            0 * demo_api:slo_http_requests:rate30d
        - record: demo_api:slo_availability:ratio30d
          expr: |
            1 - (
              demo_api:slo_http_5xx:rate30d
              /
              clamp_min(demo_api:slo_http_requests:rate30d, 0.000000001)
            )
        - record: demo_api:slo_availability_error_budget_remaining:ratio30d
          expr: |
            clamp_min(
              clamp_max(
                1 - (
                  (1 - demo_api:slo_availability:ratio30d)
                  /
                  {{ subf 1.0 .Values.slo.availabilityObjective }}
                ),
                1
              ),
              0
            )
        - record: demo_api:slo_latency_requests:rate30d
          expr: |
            sum by (deployment_environment_name, service_name, service_version, platform_release_id) (
              rate(demo_api_http_request_duration_seconds_count{
                job=~"demo-api|demo-api-stable|demo-api-canary",
                method={{ .Values.slo.method | quote }},
                route={{ .Values.slo.route | quote }}
              }[{{ .Values.slo.rollingWindow }}])
            )
        - record: demo_api:slo_latency_good:rate30d
          expr: |
            sum by (deployment_environment_name, service_name, service_version, platform_release_id) (
              rate(demo_api_http_request_duration_seconds_bucket{
                job=~"demo-api|demo-api-stable|demo-api-canary",
                method={{ .Values.slo.method | quote }},
                route={{ .Values.slo.route | quote }},
                le={{ .Values.slo.latencyThresholdSeconds | quote }}
              }[{{ .Values.slo.rollingWindow }}])
            )
        - record: demo_api:slo_latency:ratio30d
          expr: |
            demo_api:slo_latency_good:rate30d
            /
            clamp_min(demo_api:slo_latency_requests:rate30d, 0.000000001)
        - record: demo_api:slo_latency_error_budget_remaining:ratio30d
          expr: |
            clamp_min(
              clamp_max(
                1 - (
                  (1 - demo_api:slo_latency:ratio30d)
                  /
                  {{ subf 1.0 .Values.slo.latencyObjective }}
                ),
                1
              ),
              0
            )
