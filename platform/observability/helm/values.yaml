environment: local
cluster: startup-devops-local

grafana:
  dashboardLabel: grafana_dashboard
  dashboardLabelValue: "1"
  datasourceUid: prometheus

recordingRules:
  evaluationInterval: 30s

slo:
  evaluationInterval: 30s
  rollingWindow: 30d
  method: GET
  route: /version
  availabilityObjective: 0.999
  latencyObjective: 0.99
  latencyThresholdSeconds: 0.5
  burnRate:
    windows:
      - {name: 5m, duration: 5m}
      - {name: 30m, duration: 30m}
      - {name: 1h, duration: 1h}
      - {name: 2h, duration: 2h}
      - {name: 6h, duration: 6h}
      - {name: 1d, duration: 1d}
      - {name: 3d, duration: 3d}
    fastPageThreshold: 14.4
    sustainedPageThreshold: 6
    slowTicketThreshold: 3
    longTicketThreshold: 1
    alertFor: 2m

alerting:
  evaluationInterval: 30s
  runbookBaseUrl: https://github.com/SterlingAureum/startup-devops-baseline/blob/main/docs/runbooks/alerts
  demoApiHttp:
    warningThreshold: 0.99
    warningFor: 10m
    criticalThreshold: 0.95
    criticalFor: 5m
  demoApiDependency:
    warningThreshold: 0.99
    warningFor: 10m
    criticalThreshold: 0.90
    criticalFor: 5m
  argoRolloutProblemFor: 5m
  argoCDApplicationUnhealthyFor: 10m
  kubernetesDeploymentUnavailableFor: 10m
  prometheusTargetDownFor: 10m
  postgresqlCollectionFailedFor: 5m

controllerMonitors:
  scrapeInterval: 30s
  argoCD:
    enabled: true
    namespace: argocd
  argoRollouts:
    enabled: true
    namespace: argo-rollouts
  cloudNativePG:
    enabled: false
    operatorNamespace: cnpg-system
    clusterNamespace: data-platform
    clusterName: postgresql-baseline
