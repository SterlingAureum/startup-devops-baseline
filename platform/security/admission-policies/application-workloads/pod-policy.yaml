apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: startup-application-pods.security.startup.dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: startup-devops-baseline
    app.kubernetes.io/component: admission-guardrails
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(container,
          container.image.matches('^.+@sha256:[0-9a-f]{64}$'))
      message: >-
        Every application container must use an immutable sha256 digest image
        reference.
      reason: Invalid
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(container,
          container.image.matches('^.+@sha256:[0-9a-f]{64}$'))
      message: >-
        Every application init container must use an immutable sha256 digest
        image reference.
      reason: Invalid
    - expression: >-
        object.spec.containers.all(container,
          has(container.resources) &&
          has(container.resources.requests) &&
          'cpu' in container.resources.requests &&
          'memory' in container.resources.requests &&
          has(container.resources.limits) &&
          'cpu' in container.resources.limits &&
          'memory' in container.resources.limits)
      message: >-
        Every application container must define cpu and memory requests and
        limits.
      reason: Invalid
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(container,
          has(container.resources) &&
          has(container.resources.requests) &&
          'cpu' in container.resources.requests &&
          'memory' in container.resources.requests &&
          has(container.resources.limits) &&
          'cpu' in container.resources.limits &&
          'memory' in container.resources.limits)
      message: >-
        Every application init container must define cpu and memory requests
        and limits.
      reason: Invalid
