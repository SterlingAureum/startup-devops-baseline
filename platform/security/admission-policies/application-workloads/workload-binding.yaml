apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: startup-application-workloads.security.startup.dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: startup-devops-baseline
    app.kubernetes.io/component: admission-guardrails
spec:
  policyName: startup-application-workloads.security.startup.dev
  validationActions:
    - Deny
    - Audit
  matchResources:
    namespaceSelector:
      matchLabels:
        platform.startup.dev/tier: application
