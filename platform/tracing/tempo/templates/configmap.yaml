apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "startup-devops-tempo.fullname" . }}
  labels:
    {{- include "startup-devops-tempo.labels" . | nindent 4 }}
data:
  tempo.yaml: |-
    stream_over_http_enabled: true
    multitenancy_enabled: false

    server:
      http_listen_address: 0.0.0.0
      http_listen_port: {{ .Values.service.httpPort }}
      grpc_listen_address: 127.0.0.1
      grpc_listen_port: 9095
      log_format: logfmt
      log_level: info

    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: "0.0.0.0:{{ .Values.service.otlpHttpPort }}"

    backend_worker:
      compaction:
        block_retention: {{ .Values.retention }}

    storage:
      trace:
        backend: local
        wal:
          path: /data/tempo/wal
        local:
          path: /data/tempo/blocks

    usage_report:
      reporting_enabled: false
