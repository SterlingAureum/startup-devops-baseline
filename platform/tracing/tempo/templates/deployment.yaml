apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "startup-devops-tempo.fullname" . }}
  labels:
    {{- include "startup-devops-tempo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "startup-devops-tempo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "startup-devops-tempo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: startup-devops-baseline
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "startup-devops-tempo.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: tempo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config.file=/etc/tempo/tempo.yaml
            - -target=all
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ .Values.service.otlpHttpPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /data/tempo
            - name: runtime
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: {{ include "startup-devops-tempo.fullname" . }}
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.storage.dataSizeLimit }}
        - name: runtime
          emptyDir:
            sizeLimit: {{ .Values.storage.runtimeSizeLimit }}
