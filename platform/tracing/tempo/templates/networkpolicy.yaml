{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "startup-devops-tempo.fullname" . }}-cluster-only
  labels:
    {{- include "startup-devops-tempo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "startup-devops-tempo.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Values.networkPolicy.collectorInstance }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.otlpHttpPort }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.httpPort }}
  egress: []
{{- end }}
