apiVersion: v1
kind: Service
metadata:
  name: {{ include "startup-devops-tempo.fullname" . }}
  labels:
    {{- include "startup-devops-tempo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "startup-devops-tempo.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.service.otlpHttpPort }}
      targetPort: otlp-http
      protocol: TCP
