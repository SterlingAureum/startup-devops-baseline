replicaCount: 1

image:
  repository: grafana/tempo
  tag: "3.0.3"
  pullPolicy: IfNotPresent

retention: 24h

storage:
  dataSizeLimit: 768Mi
  runtimeSizeLimit: 256Mi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi
    ephemeral-storage: 1536Mi

service:
  type: ClusterIP
  httpPort: 3200
  otlpHttpPort: 4318

networkPolicy:
  enabled: true
  applicationNamespace: startup-apps
  observabilityNamespace: observability
  collectorInstance: observability-otel-collector

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
